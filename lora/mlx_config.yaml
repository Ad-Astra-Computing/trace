# mlx-lm LoRA fine-tune config — Reviewer-LoRA v1.0 pilot
# Run with: python3 -m mlx_lm.lora --config lora/mlx_config.yaml
#
# Data layout expected by mlx-lm (symlinked by lora/prepare_mlx_data.sh):
#   exports/lora/train.jsonl   <- reviewer.train.jsonl
#   exports/lora/valid.jsonl   <- reviewer.dev.jsonl
#   exports/lora/test.jsonl    <- reviewer.test.jsonl
#
# The JSONL format is {"messages": [system, user, assistant]} per record,
# which mlx-lm handles natively as a chat SFT task.

model: "Qwen/Qwen2.5-Coder-14B-Instruct"

# Training data
train: true
data: "exports/lora"

# Context — max observed est. tokens is 15,079 (CVE-2025-4598, chars/4 estimate)
# Use 16384 to be safe; Qwen2.5 supports up to 128K context.
max_seq_length: 16384

# LoRA hyperparameters
lora_layers: 16          # number of transformer layers to apply LoRA to
lora_rank: 16            # LoRA rank; 8-16 standard for code tasks
lora_scale: 1.0          # LoRA alpha / rank; effective alpha = rank * scale = 16

# Training schedule
# 69 train examples × ~8 epochs ≈ 552 iters at batch_size=1
# Roughly 500 iters → ~7 epochs over the 69-example training set
batch_size: 1
iters: 500
learning_rate: 1.0e-4
lr_schedule: linear_warmup_decay
warmup: 50               # ~10% of iters

# Evaluation + checkpointing
val_batches: 12          # full 12-example dev set each eval
steps_per_eval: 50
steps_per_report: 10
save_every: 100

# Adapter output
adapter_path: "lora/adapters/reviewer-v1.0"

# Gradient accumulation (effective batch = batch_size × grad_accumulation)
# 14B model: keep batch_size=1 for memory; accumulate for stable gradients
# gradient_accumulation_steps: 4  # uncomment if loss is noisy
