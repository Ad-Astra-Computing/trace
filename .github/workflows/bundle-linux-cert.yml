name: libtiff-linux-cert (experimental — PoC not Linux-portable)

# STATUS: EXPERIMENTAL — see docs/DECISIONS.md (2026-05-12 "Linux
# Builder infrastructure proven (libtiff cert); two corpus-expansion
# findings"). The Linux Builder pipeline this workflow exercises
# (patch-apply, dispatcher, build.json shape) is proven; two findings
# block the cert from going green on libtiff specifically:
#   * patched_build phase exceeds the 60-min cap on a 2-core GHA
#     runner because libtiff's doCheck phase is slow. Pending: a
#     reproducer-instrumentation.json knob to skip doCheck on the
#     sanity phase (Reproducer-runs cover the CVE-class regression
#     dimension already).
#   * The bundle's CVE-2024-13978 PoC was Darwin-validated; on
#     Linux libtiff 4.7.0 the crafted bits/sample is rejected by
#     Fax3SetupState before reaching the vulnerable memset(NULL,...)
#     site. fax2ps exits 0 with a warning instead of SIGSEGV.
#     Pending: a Linux-portable PoC craft, OR bundle re-classified
#     as advisory-only.
#
# Kept in-tree because the workflow shape is the template for
# per-bundle Linux certs; once both findings clear, this same
# workflow runs the cert without further edits.
#
# Manual-dispatch only. End-to-end Linux Builder cert against the
# CVE-2024-13978 libtiff bundle — a positive Reproducer that does
# NOT require ASAN (the signal is a SIGSEGV null-deref observable
# without instrumentation). Companion to mruby-asan-cert.yml; this
# workflow exercises the Linux Builder path independently of the
# Linux ASAN wiring blocker tracked in DECISIONS (2026-05-12).
#
# What this proves when it goes green:
#   1. trace's Builder dispatcher (LocalNixBuildRunner) runs against
#      a pinned nixpkgs checkout on Linux + actually applies the
#      bundle's patch.diff via _apply_patch's
#      --directory=pkgs/by-name/<aa>/<attr>/ resolution.
#   2. The reproducer.nix evaluates against the pinned nixpkgs_rev
#      AND the SIGNAL substrings declared in reproducer-log.txt
#      appear verbatim in build.json.unpatched.stdout_stderr /
#      .patched.stdout_stderr.
#   3. The Steward v1 gate (policy/steward.rego, rules 1-11) accepts
#      the resulting bundle on every chain rule. allow=true with
#      empty deny set is the load-bearing assertion.
#
# Why libtiff first:
#   * kind=auto-merge already; bundle is fully artifact-complete.
#   * Reproducer signal class is SIGSEGV null-deref (deterministic
#     without instrumentation), so cert is independent of the
#     Linux ASAN cc-wrapper blocker.
#   * Already passes the offline Steward test in tests/steward/
#     against a pre-recorded build.json fixture; this workflow
#     replaces the fixture with a LIVE Linux Builder run.
#
# Workflow_dispatch only until the cert is proven stable. Not yet
# wired to push/PR (matches the mruby-asan-cert.yml convention).

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  BUNDLE_DIR_NAME: CVE-2024-13978--libtiff
  # Pinned in the bundle's bundle.json / finding.json. Bump together
  # if/when the bundle is re-pinned to a different nixpkgs revision.
  NIXPKGS_REV: f7bcfbfb19bf9b015568cec55aeb504dfb5e5879
  # OPA pin matches .github/workflows/ci.yml. Bump together.
  OPA_VERSION: "v1.0.1"

jobs:
  cert:
    name: libtiff Linux Builder + Steward cert
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ github.workspace }}

    steps:
      - uses: actions/checkout@v6

      # Pinned by full commit SHA, mirroring ci.yml + builder.yml.
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@565684385bcd71bad329742eefe8d12f2e765b39 # v13

      - name: Install OPA
        uses: open-policy-agent/setup-opa@b2b258e089860efaadaaf71bf6e3aecb4a3eeff1 # v2.4.0
        with:
          version: ${{ env.OPA_VERSION }}
          static: true

      - name: Clone pinned nixpkgs revision
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/nixpkgs"
          cd "${RUNNER_TEMP}/nixpkgs"
          git init -q
          git remote add origin https://github.com/NixOS/nixpkgs.git
          git fetch --depth=1 origin "${NIXPKGS_REV}"
          git checkout -q FETCH_HEAD
          git -c user.email=ci@example.com -c user.name=ci \
            commit --allow-empty -q -m "cert anchor"
          echo "nixpkgs HEAD: $(git rev-parse HEAD)"

      - name: Stage bundle copy in RUNNER_TEMP
        # Copy the bundle to a writable temp location so the Builder's
        # in-place writes (build.json, build.log, replay.json append)
        # don't mutate the in-repo seed. The cert is read-only over
        # the source artifacts.
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/bundle"
          cp -R "traces/example/${BUNDLE_DIR_NAME}/." "${RUNNER_TEMP}/bundle/"
          ls -la "${RUNNER_TEMP}/bundle"

      - name: Run Builder against pinned nixpkgs
        run: |
          set -euo pipefail
          nix develop --command python -m tools.trace_cli replay \
            --execute --role builder \
            --nixpkgs-checkout "${RUNNER_TEMP}/nixpkgs" \
            --builder-timeout 3600 \
            --no-verify \
            "${RUNNER_TEMP}/bundle" \
            > "${RUNNER_TEMP}/builder-output.json" \
            2> "${RUNNER_TEMP}/builder-stderr.log" || {
              echo "::error::trace replay --execute --role builder failed"
              echo "=== stderr ==="
              cat "${RUNNER_TEMP}/builder-stderr.log"
              exit 1
            }
          echo "Builder run completed; build.json:"
          cat "${RUNNER_TEMP}/bundle/build.json"

      - name: Verify build.json shape
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}/bundle"
          DISPATCH=$(python3 -c 'import json,sys; print(json.load(open("build.json"))["dispatch_outcome"])')
          if [[ "$DISPATCH" != "ok" ]]; then
            echo "::error::dispatch_outcome expected 'ok', got '$DISPATCH'"
            exit 1
          fi
          PATCHED=$(python3 -c 'import json,sys; print(json.load(open("build.json"))["patched_build"]["outcome"])')
          if [[ "$PATCHED" != "succeeded" ]]; then
            echo "::error::patched_build.outcome expected 'succeeded', got '$PATCHED'"
            exit 1
          fi
          PATCH_APPLIED=$(python3 -c 'import json,sys; print(json.load(open("build.json"))["patch_apply"]["applied"])')
          if [[ "$PATCH_APPLIED" != "True" ]]; then
            echo "::error::patch_apply.applied expected True, got '$PATCH_APPLIED'"
            exit 1
          fi

      - name: Verify SIGNAL substrings in build.json
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}/bundle"
          # SIGNAL_UNPATCHED appears verbatim in unpatched.stdout_stderr.
          python3 - <<'PY'
          import json, sys
          bj = json.load(open("build.json"))
          unp_obs = bj["unpatched"]["stdout_stderr"]
          pat_obs = bj["patched"]["stdout_stderr"]
          sig_u = "vuln-triggered: fax2ps SIGSEGV signal 11 on libtiff fax2ps with crafted FAX TIFF (CVE-2024-13978 null-deref)"
          sig_p = "rejected-malformed-input: fax2ps libtiff returned exit 1 on crafted FAX TIFF without SIGSEGV (CVE-2024-13978 fix)"
          if sig_u not in unp_obs:
              print(f"::error::SIGNAL_UNPATCHED not present in unpatched.stdout_stderr")
              print(f"observed (last 1KiB): {unp_obs[-1024:]!r}")
              sys.exit(1)
          if sig_p not in pat_obs:
              print(f"::error::SIGNAL_PATCHED not present in patched.stdout_stderr")
              print(f"observed (last 1KiB): {pat_obs[-1024:]!r}")
              sys.exit(1)
          print("Both SIGNAL substrings present verbatim.")
          PY

      - name: Run Steward (opa eval) against post-build bundle
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}/bundle"
          # Assemble the canonical Steward opa input doc per the
          # tests/steward/test_steward.py builder. We inline the
          # builder here so the workflow isn't coupled to a private
          # test helper.
          python3 - > "${RUNNER_TEMP}/opa-input.json" <<PY
          import json, os
          from pathlib import Path
          bd = Path(os.environ["RUNNER_TEMP"]) / "bundle"
          def load(name):
              p = bd / name
              return json.loads(p.read_text()) if p.is_file() else None
          provenance = []
          prov = bd / "provenance.jsonl"
          if prov.is_file():
              for line in prov.read_text().splitlines():
                  line = line.strip()
                  if line:
                      provenance.append(json.loads(line))
          inputs = {
              "bundle": load("bundle.json"),
              "finding": load("finding.json"),
              "upstream_ref": load("upstream-ref.json"),
              "replay": load("replay.json"),
              "provenance": provenance,
          }
          for field, fname in (
              ("build", "build.json"),
              ("repro_scoring", "repro-scoring-report.json"),
              ("review_scoring", "review-scoring-report.json"),
          ):
              v = load(fname)
              if v is not None:
                  inputs[field] = v
          print(json.dumps(inputs))
          PY
          opa eval --format=json \
            --data "${GITHUB_WORKSPACE}/policy/steward.rego" \
            --stdin-input \
            "data.trace.steward" \
            < "${RUNNER_TEMP}/opa-input.json" \
            > "${RUNNER_TEMP}/opa-decision.json"
          cat "${RUNNER_TEMP}/opa-decision.json"

      - name: Verify Steward verdict (allow=true, deny=[])
        run: |
          set -euo pipefail
          python3 - <<PY
          import json, sys
          from pathlib import Path
          raw = json.loads(Path("${RUNNER_TEMP}/opa-decision.json").read_text())
          decision = raw["result"][0]["expressions"][0]["value"]
          allow = decision.get("allow", False)
          deny = decision.get("deny", [])
          if not allow:
              print(f"::error::Steward verdict allow=False; expected True")
              print(f"deny entries: {json.dumps(deny, indent=2)}")
              sys.exit(1)
          if deny:
              print(f"::error::Steward deny set non-empty despite allow=True")
              print(f"deny entries: {json.dumps(deny, indent=2)}")
              sys.exit(1)
          print(f"Steward allow=True; all 11 rules satisfied.")
          PY

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v5
        if: ${{ always() }}
        with:
          name: libtiff-linux-cert-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/bundle/build.json
            ${{ runner.temp }}/bundle/build.log
            ${{ runner.temp }}/bundle/replay.json
            ${{ runner.temp }}/builder-output.json
            ${{ runner.temp }}/builder-stderr.log
            ${{ runner.temp }}/opa-input.json
            ${{ runner.temp }}/opa-decision.json
          if-no-files-found: warn
          retention-days: 90
