name: bundle-linux-cert

# Manual-dispatch Linux Builder + Steward cert for ANY bundle under
# traces/example/. Parameterized over BUNDLE (workflow_dispatch input).
# Replaces the libtiff-specific cert workflow; see docs/DECISIONS.md
# (2026-05-12 entries) for the slice history.
#
# Per docs/REPRODUCER_V1.md §4.1, a bundle's auto-merge eligibility
# requires build.json produced on x86_64-linux (Steward rule 12). This
# workflow IS that operational support: dispatch with a bundle name,
# get a Linux-attested build.json and a Steward verdict in one job.
#
# What this workflow does:
#   1. Read the bundle's nixpkgs_rev from bundle.json (not hardcoded).
#   2. Clone nixpkgs at that revision.
#   3. Run Builder against the bundle, with --builder-timeout configurable
#      via workflow input.
#   4. Verify build.json shape: dispatch_outcome=ok, patched_build.outcome
#      =succeeded, patch_apply.applied=true, host.system=x86_64-linux.
#   5. Verify SIGNAL substrings (read live from reproducer-log.txt) appear
#      in unpatched/patched stdout_stderr.
#   6. Run opa eval against the post-build bundle; assert allow=true for
#      auto-merge bundles, just-report-verdict for others.
#   7. Upload artifacts.
#
# When a bundle fails any of (4)–(6), the artifacts make the failure
# diagnosable: build.json, build.log, the live SIGNAL substrings the
# bundle declares, the OPA decision JSON. No further workflow edits
# needed for the bundle dimension; failures are bundle-curation work.

on:
  workflow_dispatch:
    inputs:
      bundle:
        description: "Bundle directory under traces/example/ (e.g. CVE-2024-13978--libtiff)"
        required: true
        type: string
      builder_timeout_seconds:
        description: "Per-build timeout for Builder phases (seconds)"
        required: false
        default: "3600"
        type: string

permissions:
  contents: read

env:
  # OPA pin matches .github/workflows/ci.yml. Bump together.
  OPA_VERSION: "v1.0.1"

jobs:
  cert:
    name: bundle Linux cert (${{ inputs.bundle }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ github.workspace }}

    steps:
      - uses: actions/checkout@v6

      - name: Resolve bundle metadata
        id: meta
        run: |
          set -euo pipefail
          BUNDLE_PATH="traces/example/${{ inputs.bundle }}"
          if [[ ! -d "${BUNDLE_PATH}" ]]; then
            echo "::error::bundle directory not found: ${BUNDLE_PATH}"
            exit 64
          fi
          NIXPKGS_REV=$(python3 -c "import json; print(json.load(open('${BUNDLE_PATH}/bundle.json'))['nixpkgs_rev'])")
          KIND=$(python3 -c "import json; print(json.load(open('${BUNDLE_PATH}/bundle.json'))['kind'])")
          EVIDENCE_PATH=$(python3 -c "import json; print(json.load(open('${BUNDLE_PATH}/bundle.json')).get('auto_merge_evidence_path','reproducer'))")
          if [[ -z "${NIXPKGS_REV}" ]]; then
            echo "::error::could not read nixpkgs_rev from ${BUNDLE_PATH}/bundle.json"
            exit 64
          fi
          echo "bundle_path=${BUNDLE_PATH}" >> "$GITHUB_OUTPUT"
          echo "nixpkgs_rev=${NIXPKGS_REV}" >> "$GITHUB_OUTPUT"
          echo "kind=${KIND}" >> "$GITHUB_OUTPUT"
          echo "evidence_path=${EVIDENCE_PATH}" >> "$GITHUB_OUTPUT"
          echo "resolved: nixpkgs_rev=${NIXPKGS_REV}, kind=${KIND}, evidence_path=${EVIDENCE_PATH}"

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14

      - name: Install OPA
        uses: open-policy-agent/setup-opa@b2b258e089860efaadaaf71bf6e3aecb4a3eeff1 # v2.4.0
        with:
          version: ${{ env.OPA_VERSION }}
          static: true

      - name: Clone pinned nixpkgs revision
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/nixpkgs"
          cd "${RUNNER_TEMP}/nixpkgs"
          git init -q
          git remote add origin https://github.com/NixOS/nixpkgs.git
          git fetch --depth=1 origin "${{ steps.meta.outputs.nixpkgs_rev }}"
          git checkout -q FETCH_HEAD
          git -c user.email=ci@example.com -c user.name=ci \
            commit --allow-empty -q -m "cert anchor"
          echo "nixpkgs HEAD: $(git rev-parse HEAD)"

      - name: Stage bundle copy in RUNNER_TEMP
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/bundle"
          cp -R "${{ steps.meta.outputs.bundle_path }}/." "${RUNNER_TEMP}/bundle/"
          ls -la "${RUNNER_TEMP}/bundle"

      - name: Run Builder against pinned nixpkgs
        run: |
          set -euo pipefail
          nix develop --command python -m tools.trace_cli replay \
            --execute --role builder \
            --nixpkgs-checkout "${RUNNER_TEMP}/nixpkgs" \
            --builder-timeout ${{ inputs.builder_timeout_seconds }} \
            --no-verify \
            "${RUNNER_TEMP}/bundle" \
            > "${RUNNER_TEMP}/builder-output.json" \
            2> "${RUNNER_TEMP}/builder-stderr.log" || {
              echo "::error::trace replay --execute --role builder failed"
              echo "=== stderr (tail) ==="
              tail -100 "${RUNNER_TEMP}/builder-stderr.log"
              exit 1
            }
          echo "Builder run completed; build.json:"
          cat "${RUNNER_TEMP}/bundle/build.json"

      - name: Verify build.json shape
        env:
          EVIDENCE_PATH: ${{ steps.meta.outputs.evidence_path }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, sys
          bj = json.load(open(os.environ["RUNNER_TEMP"] + "/bundle/build.json"))
          evidence_path = os.environ.get("EVIDENCE_PATH", "reproducer")
          errors = []
          dispatch = bj.get("dispatch_outcome")
          if evidence_path == "reviewer-attested":
              # Rule-7 escape clause: refused-no-reproducer is the expected
              # outcome (no reproducer.nix to dispatch); ok would also be fine
              # but is unusual for this path.
              if dispatch not in ("ok", "refused-no-reproducer"):
                  errors.append(
                      f"dispatch_outcome={dispatch!r}, expected 'ok' or 'refused-no-reproducer' "
                      f"(reviewer-attested path)"
                  )
          else:
              if dispatch != "ok":
                  errors.append(f"dispatch_outcome={dispatch!r}, expected 'ok'")
          if bj.get("patch_apply", {}).get("applied") is not True:
              errors.append(f"patch_apply.applied={bj.get('patch_apply', {}).get('applied')!r}, expected True")
          if bj.get("patched_build", {}).get("outcome") != "succeeded":
              errors.append(f"patched_build.outcome={bj.get('patched_build', {}).get('outcome')!r}, expected 'succeeded'")
          host = bj.get("host", {}).get("system")
          if host != "x86_64-linux":
              errors.append(f"host.system={host!r}, expected 'x86_64-linux' (Steward rule 12)")
          if errors:
              for e in errors:
                  print(f"::error::{e}")
              sys.exit(1)
          print(f"build.json shape OK on x86_64-linux (evidence_path={evidence_path}, dispatch={dispatch}).")
          PY

      - name: Verify SIGNAL substrings present in build.json
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, sys
          from pathlib import Path
          bd = Path(os.environ["RUNNER_TEMP"]) / "bundle"
          bj = json.loads((bd / "build.json").read_text())
          log_path = bd / "reproducer-log.txt"
          if not log_path.is_file():
              print("::warning::no reproducer-log.txt; skipping SIGNAL grep (bundle may be refusal-shaped)")
              sys.exit(0)
          log = log_path.read_text()
          def grab(name):
              m = re.search(rf"^{name}:\s*(.+?)\s*$", log, re.MULTILINE)
              return m.group(1) if m else None
          sig_u = grab("SIGNAL_UNPATCHED")
          sig_p = grab("SIGNAL_PATCHED")
          if not sig_u or not sig_p:
              print(f"::error::reproducer-log.txt missing SIGNAL_UNPATCHED / SIGNAL_PATCHED line")
              sys.exit(1)
          unp_obs = bj.get("unpatched", {}).get("stdout_stderr", "")
          pat_obs = bj.get("patched", {}).get("stdout_stderr", "")
          ok = True
          if sig_u not in unp_obs:
              print(f"::error::SIGNAL_UNPATCHED not present in build.json.unpatched.stdout_stderr")
              print(f"  expected: {sig_u!r}")
              print(f"  observed (last 1 KiB): {unp_obs[-1024:]!r}")
              ok = False
          if sig_p not in pat_obs:
              print(f"::error::SIGNAL_PATCHED not present in build.json.patched.stdout_stderr")
              print(f"  expected: {sig_p!r}")
              print(f"  observed (last 1 KiB): {pat_obs[-1024:]!r}")
              ok = False
          if not ok:
              sys.exit(1)
          print(f"Both SIGNAL substrings present verbatim:\n  UNPATCHED: {sig_u}\n  PATCHED:   {sig_p}")
          PY

      - name: Run Steward (opa eval) against post-build bundle
        run: |
          set -euo pipefail
          python3 - > "${RUNNER_TEMP}/opa-input.json" <<PY
          import json, os
          from pathlib import Path
          bd = Path(os.environ["RUNNER_TEMP"]) / "bundle"
          def load(name):
              p = bd / name
              return json.loads(p.read_text()) if p.is_file() else None
          provenance = []
          prov = bd / "provenance.jsonl"
          if prov.is_file():
              for line in prov.read_text().splitlines():
                  line = line.strip()
                  if line:
                      provenance.append(json.loads(line))
          inputs = {
              "bundle": load("bundle.json"),
              "finding": load("finding.json"),
              "upstream_ref": load("upstream-ref.json"),
              "replay": load("replay.json"),
              "provenance": provenance,
          }
          for field, fname in (
              ("build", "build.json"),
              ("repro_scoring", "repro-scoring-report.json"),
              ("review_scoring", "review-scoring-report.json"),
              ("reproducer_refusal", "reproducer-refusal.json"),
          ):
              v = load(fname)
              if v is not None:
                  inputs[field] = v
          print(json.dumps(inputs))
          PY
          opa eval --format=json \
            --data "${GITHUB_WORKSPACE}/policy/steward.rego" \
            --stdin-input \
            "data.trace.steward" \
            < "${RUNNER_TEMP}/opa-input.json" \
            > "${RUNNER_TEMP}/opa-decision.json"
          cat "${RUNNER_TEMP}/opa-decision.json"

      - name: Verify Steward verdict matches bundle.kind
        run: |
          set -euo pipefail
          python3 - <<PY
          import json, os, sys
          from pathlib import Path
          raw = json.loads(Path(os.environ["RUNNER_TEMP"] + "/opa-decision.json").read_text())
          decision = raw["result"][0]["expressions"][0]["value"]
          allow = decision.get("allow", False)
          deny = decision.get("deny", [])
          kind = "${{ steps.meta.outputs.kind }}"
          if kind == "auto-merge":
              if not allow:
                  print(f"::error::bundle.kind=auto-merge but Steward allow=False")
                  print(f"deny entries: {json.dumps(deny, indent=2)}")
                  sys.exit(1)
              if deny:
                  print(f"::error::allow=True but deny non-empty; contract violation")
                  sys.exit(1)
              print(f"bundle.kind=auto-merge AND Steward allow=True. All 12 rules satisfied.")
          else:
              # For human-review-required / advisory-only bundles, just
              # report the verdict; the workflow doesn't gate on allow=False.
              print(f"bundle.kind={kind}; Steward allow={allow}, deny={len(deny)} rule(s)")
              if deny:
                  print(f"deny entries: {json.dumps(deny, indent=2)}")
          PY

      - name: Write run summary
        if: ${{ always() }}
        # Plain python3 (stdlib-only renderer) — NOT `nix develop --command`,
        # whose startup banner would contaminate the step summary. Run as a
        # standalone file so the package __init__ isn't imported.
        run: |
          python3 "${GITHUB_WORKSPACE}/tools/trace_cli/ci_summary.py" \
            --mode cert \
            --bundle-dir "${RUNNER_TEMP}/bundle" \
            --bundle-name "${{ inputs.bundle }}" \
            --kind "${{ steps.meta.outputs.kind }}" \
            --decision "${RUNNER_TEMP}/opa-decision.json" \
            --artifact-name "bundle-linux-cert-${{ inputs.bundle }}-${{ github.run_id }}" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ always() }}
        with:
          name: bundle-linux-cert-${{ inputs.bundle }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/bundle/build.json
            ${{ runner.temp }}/bundle/build.log
            ${{ runner.temp }}/bundle/replay.json
            ${{ runner.temp }}/builder-output.json
            ${{ runner.temp }}/builder-stderr.log
            ${{ runner.temp }}/opa-input.json
            ${{ runner.temp }}/opa-decision.json
          if-no-files-found: warn
          retention-days: 90
