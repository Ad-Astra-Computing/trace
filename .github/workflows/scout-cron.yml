name: scout-cron

# Scout cron: discover -> poll -> process for every CVE published in
# the chosen window. Manual dispatch at v0; on a future iteration this
# becomes the hourly entrypoint.
#
# Inputs:
#   lookback_hours   How far back to query NVD's pubStartDate. Default: 24.
#   graph_snapshot   Optional override path to a snapshot in the repo.
#                    When empty (the default), the workflow downloads the
#                    most recent successful nixpkgs-snapshot artifact
#                    produced by .github/workflows/scout-snapshot.yml.
#   max_cves         Cap on per-run CVE count. Default: 50.
#
# Steps:
#   1. Resolve graph snapshot (override path or latest snapshot artifact).
#   2. discover_cli prints CVE ids one per line.
#   3. For each (capped at max_cves): poll_cli writes inbox/<CVE>/...
#      then a small inline process step calls process_entry to produce
#      finding.json + resolver-input.json + upstream-ref.json.
#   4. Inbox is uploaded as an artifact for inspection.
#
# Anonymous-first; NVD_API_KEY (optional secret) lifts rate limits.

on:
  workflow_dispatch:
    inputs:
      lookback_hours:
        description: "How many hours back to query NVD"
        required: false
        type: number
        default: 24
      graph_snapshot:
        description: "Path to graph snapshot JSON in the repo (overrides downloaded artifact)"
        required: false
        type: string
        default: ""
      max_cves:
        description: "Cap on per-run CVE count (avoids surprise API spend)"
        required: false
        type: number
        default: 50
      include_nix_seed:
        description: "Also seed from vulnpatch /nix/cves (pre-mapped nixpkgs CVEs)"
        required: false
        type: boolean
        default: true
  schedule:
    # Hourly at :17 (offset from snapshot 06:13 so the early-morning
    # cron has the freshest snapshot available).
    - cron: "17 */6 * * *"   # every 6h (was hourly) — CVE harvest cost cut, 2026-07-19

permissions:
  contents: write  # commit the longitudinal run record to data/
  actions: read    # gh run download for the snapshot artifact
  id-token: write  # FlakeHub OIDC for the Determinate Nix installer

concurrency:
  # Serialize cron runs so the cursor file isn't written by two
  # in-flight jobs at the same time. cancel-in-progress=false:
  # let the running job finish and queue the new one.
  group: scout-cron
  cancel-in-progress: false

jobs:
  cron:
    name: scout discover + poll + process
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22 (pinned 2026-05-23)
        with:
          determinate: true

      - name: Install opa
        # The flake's dev shell intentionally omits opa (15-min Go
        # rebuild on darwin-arm64 has no binary cache hit). CI must
        # supply it explicitly so Steward can route entries. Without
        # this step Steward silently fails on every CVE and the run
        # summary records steward_error: opa-unavailable.
        run: |
          set -euo pipefail
          OPA_VERSION="v1.15.2"
          ARCH=$(uname -m | sed 's/x86_64/amd64/' | sed 's/aarch64/arm64/')
          # --retry 5 + retry-all-errors absorbs transient 5xxs from
          # the OPA download CDN. Saw a 502 take out an entire cron on
          # 2026-05-06; fail-loud is right for code, not for vendor blips.
          curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors \
            "https://openpolicyagent.org/downloads/${OPA_VERSION}/opa_linux_${ARCH}_static" \
            -o /usr/local/bin/opa
          chmod +x /usr/local/bin/opa
          # Don't pipe to head: under `set -o pipefail`, opa SIGPIPEs on
          # its second line (head closes the pipe after one) and the
          # whole step exits 141. The output is short; print it raw.
          opa version

      - name: Restore scout state (cursor + retry queue)
        id: state-restore
        uses: actions/cache/restore@v5
        with:
          # state/ holds three files written by this workflow:
          #   scout-cursor.json    discovery watermark (last_run_utc)
          #   scout-retry.jsonl    transient-failure retry queue
          #   nix-seed-seen.jsonl  vulnpatch /nix/cves evaluation ledger
          # All persist across runs via this single cache.
          path: state
          # Cache keys are immutable; each successful run writes a new
          # scout-state-v1-<run_id> key and we pull the freshest match
          # via the restore-keys prefix.
          key: scout-state-v1-restore-${{ github.run_id }}
          restore-keys: |
            scout-state-v1-
            scout-cursor-v1-

      - name: Resolve snapshot
        id: snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          OVERRIDE: ${{ inputs.graph_snapshot || '' }}
        run: |
          set -euo pipefail
          mkdir -p snapshot
          if [[ -n "$OVERRIDE" ]]; then
            if [[ ! -f "$OVERRIDE" ]]; then
              echo "::error::graph snapshot override not found at $OVERRIDE"
              echo "ready=false" >> "$GITHUB_OUTPUT"
              echo "reason=override-missing:$OVERRIDE" >> "$GITHUB_OUTPUT"
              exit 64
            fi
            echo "Using committed snapshot at $OVERRIDE"
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "path=$OVERRIDE" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          run_id=$(gh run list --workflow=scout-snapshot.yml --status=success --limit 1 --json databaseId --jq '.[0].databaseId' || true)
          if [[ -z "$run_id" || "$run_id" == "null" ]]; then
            # No successful snapshot yet (first deploy / snapshot down).
            # Surface a clean skip in the step summary instead of
            # failing the whole cron and burning a no-data alert.
            echo "::warning::no successful scout-snapshot run found yet; skipping discover/poll/process"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "reason=no-snapshot-artifact" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Downloading snapshot artifact from scout-snapshot run $run_id"
          if ! gh run download "$run_id" --name nixpkgs-snapshot --dir snapshot; then
            echo "::warning::scout-snapshot artifact found (run $run_id) but download failed; skipping"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "reason=artifact-download-failed:$run_id" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "path=snapshot/nixpkgs-snapshot.json" >> "$GITHUB_OUTPUT"

      - name: Resolve CPE index (optional)
        # Best-effort download of the latest scout-cpe-dictionary artifact.
        # When present, batch_cli enriches snapshot records with real
        # CPEs so Scout matches at cpe-exact (high confidence). When
        # missing, the cron still runs fine via the cpe-product
        # vendor-agnostic fallback.
        id: cpe-index
        if: steps.snapshot.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p cpe-index
          run_id=$(gh run list --workflow=scout-cpe-dictionary.yml --status=success --limit 1 --json databaseId --jq '.[0].databaseId' || true)
          if [[ -z "$run_id" || "$run_id" == "null" ]]; then
            echo "::notice::no successful scout-cpe-dictionary run yet; skipping CPE enrichment"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Downloading CPE index artifact from scout-cpe-dictionary run $run_id"
          if ! gh run download "$run_id" --name cpe-index --dir cpe-index; then
            echo "::warning::cpe-index artifact found (run $run_id) but download failed; falling back to cpe-product matching"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "path=cpe-index/cpe-index.json" >> "$GITHUB_OUTPUT"

      - name: Discover CVEs
        id: discover
        if: steps.snapshot.outputs.ready == 'true'
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          LOOKBACK_HOURS: ${{ inputs.lookback_hours || '' }}
          MAX_CVES: ${{ inputs.max_cves || '50' }}
          INCLUDE_NIX_SEED: ${{ github.event_name == 'schedule' && 'true' || inputs.include_nix_seed }}
        run: |
          set -euo pipefail
          mkdir -p inbox out state
          UNTIL=$(date -u +%FT%TZ)
          # Window resolution priority:
          #   1. Explicit lookback_hours input (workflow_dispatch override).
          #   2. Cursor file from the last successful run (state/scout-cursor.json).
          #   3. Default 1 hour lookback (matches the hourly schedule).
          # Caps: if cursor is older than 7 days (cron offline a long time),
          # clamp to 7 days to keep the NVD response tractable. Surface a
          # warning so the gap is visible in the run summary.
          if [[ -n "$LOOKBACK_HOURS" ]]; then
            SINCE=$(date -u -d "$LOOKBACK_HOURS hours ago" +%FT%TZ)
            window_source="explicit-lookback:${LOOKBACK_HOURS}h"
          elif [[ -s state/scout-cursor.json ]]; then
            cursor_iso=$(jq -r '.last_run_utc // empty' state/scout-cursor.json)
            if [[ -z "$cursor_iso" ]]; then
              SINCE=$(date -u -d '1 hour ago' +%FT%TZ)
              window_source="cursor-empty:default-1h"
            else
              cursor_epoch=$(date -u -d "$cursor_iso" +%s)
              now_epoch=$(date -u +%s)
              max_lookback=$((7 * 24 * 3600))
              age=$((now_epoch - cursor_epoch))
              if (( age > max_lookback )); then
                SINCE=$(date -u -d '7 days ago' +%FT%TZ)
                window_source="cursor-stale:${age}s>7d"
                echo "::warning::cursor is $age seconds old (>7d); clamped to 7-day lookback"
              else
                SINCE=$cursor_iso
                window_source="cursor:${cursor_iso}"
              fi
            fi
          else
            SINCE=$(date -u -d '1 hour ago' +%FT%TZ)
            window_source="no-cursor:default-1h"
          fi

          echo "Window: $SINCE -> $UNTIL (source: $window_source)"
          echo "since=$SINCE" >> "$GITHUB_OUTPUT"
          echo "until=$UNTIL" >> "$GITHUB_OUTPUT"
          echo "window_source=$window_source" >> "$GITHUB_OUTPUT"

          nix develop --command python -m agents.scout.discover_cli \
            --since "$SINCE" --until "$UNTIL" \
            > out/cve-ids.raw.txt
          # Defensive grep: any future stdout pollution (banner, warning,
          # whatever) gets dropped before it can corrupt the poll loop.
          grep -E '^CVE-[0-9]{4}-[0-9]{4,19}$' out/cve-ids.raw.txt > out/cve-ids.discovered.txt || true

          # Second discovery source: the vulnpatch /nix/cves snapshot (open
          # nixpkgs-affecting CVEs, already mapped to an attr). This is a
          # CURATED BACKLOG (~235 currently-open CVEs), not a fresh-publish
          # feed, so it is NOT windowed to [SINCE,UNTIL] (that emitted ~1/run).
          # Instead the cross-run ledger (state/nix-seed-seen.jsonl) drains the
          # backlog once, then emits only new / changed / TTL-expired entries;
          # the emit sidecar records the fingerprint each id was evaluated at so
          # the post-run "Update nix-seed ledger" step can mark terminal
          # outcomes. Every id still flows through the SAME poll -> process path
          # (graph lookup + relevance), so the vulnpatch mapping is only a seed
          # hint, never a merge decision. Non-fatal: the NVD walk is
          # authoritative for completeness; a feed hiccup never fails the run or
          # blocks NVD-discovered ids.
          if [[ "${INCLUDE_NIX_SEED:-true}" == "true" ]]; then
            if nix develop --command python -m agents.scout.discover_nix_cli \
                 --seen-ledger state/nix-seed-seen.jsonl \
                 --emit-sidecar out/nixseed-emitted.jsonl \
                 > out/cve-ids.nixseed.raw.txt 2> out/nixseed.err.txt; then
              grep -E '^CVE-[0-9]{4}-[0-9]{4,19}$' out/cve-ids.nixseed.raw.txt \
                > out/cve-ids.nixseed.txt || true
            else
              echo "::warning::vulnpatch /nix/cves seed failed; $(head -1 out/nixseed.err.txt || true)"
              : > out/cve-ids.nixseed.txt
            fi
          else
            : > out/cve-ids.nixseed.txt
          fi

          # Prepend the retry queue (oldest first) so transient failures
          # from prior runs get a chance before they age out, then the
          # newly-discovered window. awk dedupes preserving first-seen
          # order (older retries beat newer rediscoveries).
          if [[ -f state/scout-retry.jsonl ]]; then
            nix develop --command python -m agents.scout.retry_cli emit \
              --queue state/scout-retry.jsonl \
              > out/cve-ids.retry.txt
          else
            : > out/cve-ids.retry.txt
          fi

          retry_count=$(wc -l < out/cve-ids.retry.txt | tr -d ' ')
          discovered=$(wc -l < out/cve-ids.discovered.txt | tr -d ' ')
          nix_seed_count=$(wc -l < out/cve-ids.nixseed.txt | tr -d ' ')
          # Order = retries first (age-out priority), then the NVD window,
          # then the vulnpatch nix-seed. awk dedupes preserving first-seen,
          # so a CVE the NVD walk already found is not re-queued by the seed.
          cat out/cve-ids.retry.txt out/cve-ids.discovered.txt out/cve-ids.nixseed.txt \
            | awk '!seen[$0]++' \
            > out/cve-ids.txt

          total=$(wc -l < out/cve-ids.txt | tr -d ' ')
          echo "discovered=$discovered" >> "$GITHUB_OUTPUT"
          echo "nix_seed=$nix_seed_count" >> "$GITHUB_OUTPUT"
          echo "retry_count=$retry_count" >> "$GITHUB_OUTPUT"
          echo "total=$total" >> "$GITHUB_OUTPUT"
          echo "Discovered $discovered new CVE ids (+$nix_seed_count nix-seed); queued $retry_count retries; $total to process."
          head -n "$MAX_CVES" out/cve-ids.txt > out/cve-ids.capped.txt
          capped=$(wc -l < out/cve-ids.capped.txt | tr -d ' ')
          echo "capped=$capped" >> "$GITHUB_OUTPUT"
          echo "Processing $capped (cap=$MAX_CVES)."

      - name: Resolve nixpkgs checkout for auto-prefetch
        # batch_cli's --nixpkgs-root needs a real nixpkgs tree to read
        # package.nix. The flake's nixpkgs input is the ground truth;
        # surface its path so the next step can pass it through.
        # Fail-soft: if the eval fails, auto-prefetch is skipped and
        # the cron continues without enrichment.
        id: nixpkgs-root
        if: steps.snapshot.outputs.ready == 'true'
        run: |
          set -euo pipefail
          if root=$(nix flake archive --json 2>/dev/null \
              | jq -r '.inputs.nixpkgs.path // empty'); then
            if [[ -n "$root" && -d "$root" ]]; then
              echo "path=$root" >> "$GITHUB_OUTPUT"
              echo "ready=true" >> "$GITHUB_OUTPUT"
              echo "Resolved nixpkgs root at $root"
            else
              echo "ready=false" >> "$GITHUB_OUTPUT"
              echo "WARN: nix flake archive returned empty path; auto-prefetch will skip"
            fi
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "WARN: nix flake archive failed; auto-prefetch will skip"
          fi

      - name: Poll + process each CVE
        if: steps.snapshot.outputs.ready == 'true'
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          GRAPH_SNAPSHOT: ${{ steps.snapshot.outputs.path }}
          CPE_INDEX_READY: ${{ steps.cpe-index.outputs.ready }}
          CPE_INDEX: ${{ steps.cpe-index.outputs.path }}
          NIXPKGS_ROOT_READY: ${{ steps.nixpkgs-root.outputs.ready }}
          NIXPKGS_ROOT: ${{ steps.nixpkgs-root.outputs.path }}
          # Live-call gates for auto-prefetch. Both gates require
          # --nixpkgs-root to be supplied to actually run.
          #   TRACE_REAL_PREFETCH=1 → plain-fetchurl via nix-prefetch-url
          #   TRACE_REAL_FETCHZIP=1 → fetchFromGitHub via fetchzip FOD
          #                          extraction (nix-build with fakeHash).
          #                          Scope is intentionally narrow: only
          #                          fires for fetchFromGitHub-shaped src;
          #                          generic fetchzip stays skipped.
          TRACE_REAL_PREFETCH: "1"
          TRACE_REAL_FETCHZIP: "1"
        run: |
          set -euo pipefail
          # batch_cli loops in-process so we pay the nix-shell + python
          # interpreter boot cost once instead of once per CVE.
          # Per-CVE exceptions are isolated: one bad fetch does not
          # stop the batch (those land as action=error in the JSONL).
          extra=()
          if [[ "${CPE_INDEX_READY:-false}" == "true" ]]; then
            extra+=("--cpe-index" "$CPE_INDEX")
          fi
          if [[ "${NIXPKGS_ROOT_READY:-false}" == "true" ]]; then
            extra+=("--nixpkgs-root" "$NIXPKGS_ROOT")
            extra+=("--use-nix-eval")
            extra+=("--aggregate-counts" "out/auto-prefetch-counts.json")
          fi
          nix develop --command python -m agents.scout.batch_cli \
            --cve-ids-file out/cve-ids.capped.txt \
            --graph-snapshot "$GRAPH_SNAPSHOT" \
            --inbox inbox \
            --output-jsonl out/run-summary.jsonl \
            "${extra[@]}"
          echo "Run summary:"
          jq -s 'group_by(.action // .resolver_status // "other") | map({key: (.[0].action // .[0].resolver_status // "other"), count: length})' out/run-summary.jsonl
          if [[ -f out/auto-prefetch-counts.json ]]; then
            echo "Auto-prefetch counts:"
            cat out/auto-prefetch-counts.json
          fi

      - name: Update retry queue
        if: always() && steps.snapshot.outputs.ready == 'true' && hashFiles('out/run-summary.jsonl') != ''
        env:
          UNTIL: ${{ steps.discover.outputs.until }}
        run: |
          set -euo pipefail
          mkdir -p state
          : > state/scout-retry.jsonl  # ensure file exists for first-run case
          nix develop --command python -m agents.scout.retry_cli update \
            --queue state/scout-retry.jsonl \
            --run-summary out/run-summary.jsonl \
            --run-at "$UNTIL" \
            --max-attempts 3
          echo "Retry queue size: $(wc -l < state/scout-retry.jsonl | tr -d ' ')"

      - name: Update nix-seed ledger
        # Mark this run's nix-seed CVEs terminal ONLY after processing (single
        # ledger writer). No-op when the seed emitted nothing (sidecar absent).
        if: always() && steps.snapshot.outputs.ready == 'true' && hashFiles('out/run-summary.jsonl') != ''
        env:
          UNTIL: ${{ steps.discover.outputs.until }}
        run: |
          set -euo pipefail
          mkdir -p state
          if [[ -f out/nixseed-emitted.jsonl ]]; then
            nix develop --command python -m agents.scout.nix_seed_ledger_cli update \
              --ledger state/nix-seed-seen.jsonl \
              --sidecar out/nixseed-emitted.jsonl \
              --run-summary out/run-summary.jsonl \
              --run-at "$UNTIL"
          else
            echo "no nix-seed emit sidecar; ledger unchanged"
          fi

      - name: Advance discovery cursor
        # Only advance on the schedule path. workflow_dispatch with an
        # explicit lookback_hours override is one-off (often replaying
        # a window) and must not clobber the schedule's cursor.
        if: steps.snapshot.outputs.ready == 'true' && github.event_name == 'schedule'
        env:
          UNTIL: ${{ steps.discover.outputs.until }}
        run: |
          set -euo pipefail
          mkdir -p state
          jq -n --arg ts "$UNTIL" \
            '{schema_version: "1.0.0", last_run_utc: $ts}' \
            > state/scout-cursor.json
          echo "Cursor advanced to $UNTIL"

      - name: Save scout state
        # Save on schedule (advances cursor) AND on workflow_dispatch
        # (retry queue may have changed). The cache key is per-run so
        # this never overwrites; restore picks the freshest by prefix.
        if: steps.snapshot.outputs.ready == 'true'
        uses: actions/cache/save@v5
        with:
          path: state
          key: scout-state-v1-${{ github.run_id }}

      - name: Render step summary
        if: always()
        env:
          DISCOVERED: ${{ steps.discover.outputs.discovered }}
          RETRY_COUNT: ${{ steps.discover.outputs.retry_count }}
          QUEUED_TOTAL: ${{ steps.discover.outputs.total }}
          PROCESSED: ${{ steps.discover.outputs.capped }}
          WINDOW_SINCE: ${{ steps.discover.outputs.since }}
          WINDOW_UNTIL: ${{ steps.discover.outputs.until }}
          WINDOW_SOURCE: ${{ steps.discover.outputs.window_source }}
          SNAPSHOT_READY: ${{ steps.snapshot.outputs.ready }}
          SNAPSHOT_SKIP_REASON: ${{ steps.snapshot.outputs.reason }}
        run: |
          set -euo pipefail
          if [[ "$SNAPSHOT_READY" != "true" ]]; then
            {
              echo "## Scout cron skipped"
              echo ""
              echo "Reason: \`${SNAPSHOT_SKIP_REASON:-unknown}\`."
              echo ""
              echo "Trigger \`scout-snapshot.yml\` (Actions tab → run workflow) to populate the artifact, or commit a snapshot and pass its path via the \`graph_snapshot\` input."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ ! -f out/run-summary.jsonl ]]; then
            echo "## Scout cron run" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "_no run summary produced (job may have failed before the loop)._" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Merge poll + process records by cve_id (later writes win,
          # which is what we want: process outcome supersedes the
          # written-poll outcome).
          jq -s 'group_by(.cve_id) | map(reduce .[] as $r ({}; . * $r))' \
            out/run-summary.jsonl > out/merged.json

          {
            echo "## Scout cron run"
            echo ""
            echo "- Window: \`${WINDOW_SINCE}\` -> \`${WINDOW_UNTIL}\` (source: \`${WINDOW_SOURCE:-unknown}\`)"
            echo "- Discovered: **${DISCOVERED:-0}** (new in window)"
            echo "- Retries: **${RETRY_COUNT:-0}** (queued from prior runs)"
            echo "- Queued total: **${QUEUED_TOTAL:-0}**, processed **${PROCESSED:-0}** (cap)"
            echo ""
            echo "### Per-CVE outcomes"
            echo ""
            echo "| CVE | action | finding | resolver verdict | feed |"
            echo "|-----|--------|---------|------------------|------|"
            jq -r '
              sort_by(.cve_id)[] |
              "| `" + .cve_id + "` | " +
              (.action // "-") + " | " +
              (.finding_status // "-") + " | " +
              (.resolver_status // "-") + " | " +
              (.feed_used // "-") + " |"
            ' out/merged.json
            echo ""

            echo "### Action breakdown"
            echo ""
            echo '```mermaid'
            echo "pie showData title Poll actions"
            jq -r '
              group_by(.action) |
              map(select(.[0].action != null)) |
              .[] |
              "    \"" + (.[0].action) + "\" : " + (length | tostring)
            ' out/merged.json
            echo '```'
            echo ""

            echo "### Resolver verdicts"
            echo ""
            echo '```mermaid'
            echo "pie showData title Resolver verdicts"
            jq -r '
              group_by(.resolver_status) |
              map(select(.[0].resolver_status != null)) |
              .[] |
              "    \"" + (.[0].resolver_status) + "\" : " + (length | tostring)
            ' out/merged.json
            # Mermaid refuses to render an empty pie; stub a no-op slice.
            if ! jq -e 'any(.resolver_status != null)' out/merged.json > /dev/null; then
              echo "    \"no findings\" : 1"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Append longitudinal run record
        # Schedule-only: each scheduled cron contributes one aggregated row
        # to data/scout-runs.jsonl. Manual workflow_dispatch runs are
        # operational replays and do not pollute the time series.
        #
        # The row lands on the UNPROTECTED `scout-telemetry` branch, not main.
        # data/scout-runs.jsonl is append-only run telemetry that is not part
        # of cert/corpus integrity (its only reader is `trace report`'s
        # throughput roll-up, which tolerates whatever file the checkout
        # provides and ignores unknown fields). Keeping it off main preserves
        # main's required-check gate — github-actions[bot] can't bypass the
        # ruleset, and a [skip ci] / paths-ignored data commit can never
        # satisfy the required checks, so a direct push to protected main
        # would be rejected and the data point silently lost. Each row records
        # the main SHA the run observed so the series stays correlatable.
        if: steps.snapshot.outputs.ready == 'true' && github.event_name == 'schedule'
        env:
          WINDOW_SINCE: ${{ steps.discover.outputs.since }}
          WINDOW_UNTIL: ${{ steps.discover.outputs.until }}
          WINDOW_SOURCE: ${{ steps.discover.outputs.window_source }}
          DISCOVERED: ${{ steps.discover.outputs.total }}
          PROCESSED: ${{ steps.discover.outputs.capped }}
          RUN_ID: ${{ github.run_id }}
          MAIN_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p data
          if [[ -f out/merged.json ]]; then
            actions=$(jq '[group_by(.action)[] | select(.[0].action != null) | {(.[0].action): length}] | add // {}' out/merged.json)
            verdicts=$(jq '[group_by(.resolver_status)[] | select(.[0].resolver_status != null) | {(.[0].resolver_status): length}] | add // {}' out/merged.json)
          else
            actions='{}'
            verdicts='{}'
          fi
          record=$(jq -cn \
            --arg run_at "$WINDOW_UNTIL" \
            --arg since "$WINDOW_SINCE" \
            --arg source "$WINDOW_SOURCE" \
            --arg run_id "$RUN_ID" \
            --arg main_sha "$MAIN_SHA" \
            --argjson discovered "${DISCOVERED:-0}" \
            --argjson processed "${PROCESSED:-0}" \
            --argjson actions "$actions" \
            --argjson verdicts "$verdicts" \
            '{
               schema_version: "1.1.0",
               run_at: $run_at,
               window_since: $since,
               window_source: $source,
               run_id: $run_id,
               main_sha: $main_sha,
               discovered: $discovered,
               processed: $processed,
               actions: $actions,
               resolver_verdicts: $verdicts
             }')
          git config user.name "scout-cron[bot]"
          git config user.email "scout-cron[bot]@users.noreply.github.com"
          # Base the append on scout-telemetry's own history so prior rows
          # survive; seed from main's current file only if the branch is
          # truly absent on origin. Fetch with an explicit destination —
          # `git fetch origin scout-telemetry` alone only writes FETCH_HEAD
          # and never creates origin/scout-telemetry, which would make every
          # run reseed from main and clobber the series.
          git fetch origin "scout-telemetry:refs/remotes/origin/scout-telemetry" || true
          if git rev-parse --verify origin/scout-telemetry >/dev/null 2>&1; then
            git checkout -B scout-telemetry origin/scout-telemetry
          else
            git checkout -B scout-telemetry
          fi
          echo "$record" >> data/scout-runs.jsonl
          git add data/scout-runs.jsonl
          git commit -m "data(scout): cron run ${WINDOW_UNTIL} [skip ci]"
          for attempt in 1 2 3; do
            # Serialized by the job concurrency group; the rebase covers the
            # rare cross-run race. Append-only file => conflict-free rebase.
            git pull --rebase --autostash origin scout-telemetry 2>/dev/null || true
            if git push origin HEAD:refs/heads/scout-telemetry; then
              echo "pushed run record to scout-telemetry on attempt $attempt"
              exit 0
            fi
            echo "push attempt $attempt failed; retrying"
            sleep $((attempt * 5))
          done
          echo "::warning::failed to push longitudinal run record after 3 attempts; data point lost"
          exit 0  # do not fail the cron over an aux push

      - name: Upload inbox + run summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: scout-cron-${{ github.run_id }}
          path: |
            inbox/
            out/
          if-no-files-found: warn
          retention-days: 14
