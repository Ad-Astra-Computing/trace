name: scout-cron

# Scout cron: discover -> poll -> process for every CVE published in
# the chosen window. Manual dispatch at v0; on a future iteration this
# becomes the hourly entrypoint.
#
# Inputs:
#   lookback_hours   How far back to query NVD's pubStartDate. Default: 24.
#   graph_snapshot   Optional override path to a snapshot in the repo.
#                    When empty (the default), the workflow downloads the
#                    most recent successful nixpkgs-snapshot artifact
#                    produced by .github/workflows/scout-snapshot.yml.
#   max_cves         Cap on per-run CVE count. Default: 50.
#
# Steps:
#   1. Resolve graph snapshot (override path or latest snapshot artifact).
#   2. discover_cli prints CVE ids one per line.
#   3. For each (capped at max_cves): poll_cli writes inbox/<CVE>/...
#      then a small inline process step calls process_entry to produce
#      finding.json + resolver-input.json + upstream-ref.json.
#   4. Inbox is uploaded as an artifact for inspection.
#
# Anonymous-first; NVD_API_KEY (optional secret) lifts rate limits.

on:
  workflow_dispatch:
    inputs:
      lookback_hours:
        description: "How many hours back to query NVD"
        required: false
        type: number
        default: 24
      graph_snapshot:
        description: "Path to graph snapshot JSON in the repo (overrides downloaded artifact)"
        required: false
        type: string
        default: ""
      max_cves:
        description: "Cap on per-run CVE count (avoids surprise API spend)"
        required: false
        type: number
        default: 50
  schedule:
    # Hourly at :17 (offset from snapshot 06:13 so the early-morning
    # cron has the freshest snapshot available).
    - cron: "17 * * * *"

permissions:
  contents: write  # commit the longitudinal run record to data/
  actions: read    # gh run download for the snapshot artifact
  id-token: write  # FlakeHub OIDC for the Determinate Nix installer

concurrency:
  # Serialize cron runs so the cursor file isn't written by two
  # in-flight jobs at the same time. cancel-in-progress=false:
  # let the running job finish and queue the new one.
  group: scout-cron
  cancel-in-progress: false

jobs:
  cron:
    name: scout discover + poll + process
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v20
        with:
          determinate: true

      - name: Restore discovery cursor
        id: cursor-restore
        uses: actions/cache/restore@v4
        with:
          path: state/scout-cursor.json
          # GitHub Actions cache keys are immutable, so each successful
          # run writes a new key (scout-cursor-v1-<run_id>) and we pull
          # the freshest match via the restore-keys prefix. The primary
          # `key` here is intentionally unique-per-run so it never
          # primary-matches.
          key: scout-cursor-v1-restore-${{ github.run_id }}
          restore-keys: |
            scout-cursor-v1-

      - name: Resolve snapshot
        id: snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          OVERRIDE: ${{ inputs.graph_snapshot || '' }}
        run: |
          set -euo pipefail
          mkdir -p snapshot
          if [[ -n "$OVERRIDE" ]]; then
            if [[ ! -f "$OVERRIDE" ]]; then
              echo "::error::graph snapshot override not found at $OVERRIDE"
              echo "ready=false" >> "$GITHUB_OUTPUT"
              echo "reason=override-missing:$OVERRIDE" >> "$GITHUB_OUTPUT"
              exit 64
            fi
            echo "Using committed snapshot at $OVERRIDE"
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "path=$OVERRIDE" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          run_id=$(gh run list --workflow=scout-snapshot.yml --status=success --limit 1 --json databaseId --jq '.[0].databaseId' || true)
          if [[ -z "$run_id" || "$run_id" == "null" ]]; then
            # No successful snapshot yet (first deploy / snapshot down).
            # Surface a clean skip in the step summary instead of
            # failing the whole cron and burning a no-data alert.
            echo "::warning::no successful scout-snapshot run found yet; skipping discover/poll/process"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "reason=no-snapshot-artifact" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Downloading snapshot artifact from scout-snapshot run $run_id"
          if ! gh run download "$run_id" --name nixpkgs-snapshot --dir snapshot; then
            echo "::warning::scout-snapshot artifact found (run $run_id) but download failed; skipping"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "reason=artifact-download-failed:$run_id" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "path=snapshot/nixpkgs-snapshot.json" >> "$GITHUB_OUTPUT"

      - name: Discover CVEs
        id: discover
        if: steps.snapshot.outputs.ready == 'true'
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          LOOKBACK_HOURS: ${{ inputs.lookback_hours || '' }}
          MAX_CVES: ${{ inputs.max_cves || '50' }}
        run: |
          set -euo pipefail
          mkdir -p inbox out state
          UNTIL=$(date -u +%FT%TZ)
          # Window resolution priority:
          #   1. Explicit lookback_hours input (workflow_dispatch override).
          #   2. Cursor file from the last successful run (state/scout-cursor.json).
          #   3. Default 1 hour lookback (matches the hourly schedule).
          # Caps: if cursor is older than 7 days (cron offline a long time),
          # clamp to 7 days to keep the NVD response tractable. Surface a
          # warning so the gap is visible in the run summary.
          if [[ -n "$LOOKBACK_HOURS" ]]; then
            SINCE=$(date -u -d "$LOOKBACK_HOURS hours ago" +%FT%TZ)
            window_source="explicit-lookback:${LOOKBACK_HOURS}h"
          elif [[ -s state/scout-cursor.json ]]; then
            cursor_iso=$(jq -r '.last_run_utc // empty' state/scout-cursor.json)
            if [[ -z "$cursor_iso" ]]; then
              SINCE=$(date -u -d '1 hour ago' +%FT%TZ)
              window_source="cursor-empty:default-1h"
            else
              cursor_epoch=$(date -u -d "$cursor_iso" +%s)
              now_epoch=$(date -u +%s)
              max_lookback=$((7 * 24 * 3600))
              age=$((now_epoch - cursor_epoch))
              if (( age > max_lookback )); then
                SINCE=$(date -u -d '7 days ago' +%FT%TZ)
                window_source="cursor-stale:${age}s>7d"
                echo "::warning::cursor is $age seconds old (>7d); clamped to 7-day lookback"
              else
                SINCE=$cursor_iso
                window_source="cursor:${cursor_iso}"
              fi
            fi
          else
            SINCE=$(date -u -d '1 hour ago' +%FT%TZ)
            window_source="no-cursor:default-1h"
          fi

          echo "Window: $SINCE -> $UNTIL (source: $window_source)"
          echo "since=$SINCE" >> "$GITHUB_OUTPUT"
          echo "until=$UNTIL" >> "$GITHUB_OUTPUT"
          echo "window_source=$window_source" >> "$GITHUB_OUTPUT"

          nix develop --command python -m agents.scout.discover_cli \
            --since "$SINCE" --until "$UNTIL" \
            > out/cve-ids.raw.txt
          # Defensive grep: any future stdout pollution (banner, warning,
          # whatever) gets dropped before it can corrupt the poll loop.
          grep -E '^CVE-[0-9]{4}-[0-9]{4,19}$' out/cve-ids.raw.txt > out/cve-ids.txt || true

          total=$(wc -l < out/cve-ids.txt | tr -d ' ')
          echo "total=$total" >> "$GITHUB_OUTPUT"
          echo "Discovered $total CVE ids."
          head -n "$MAX_CVES" out/cve-ids.txt > out/cve-ids.capped.txt
          capped=$(wc -l < out/cve-ids.capped.txt | tr -d ' ')
          echo "capped=$capped" >> "$GITHUB_OUTPUT"
          echo "Processing $capped (cap=$MAX_CVES)."

      - name: Poll + process each CVE
        if: steps.snapshot.outputs.ready == 'true'
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          GRAPH_SNAPSHOT: ${{ steps.snapshot.outputs.path }}
        run: |
          set -euo pipefail
          # batch_cli loops in-process so we pay the nix-shell + python
          # interpreter boot cost once instead of once per CVE.
          # Per-CVE exceptions are isolated: one bad fetch does not
          # stop the batch (those land as action=error in the JSONL).
          nix develop --command python -m agents.scout.batch_cli \
            --cve-ids-file out/cve-ids.capped.txt \
            --graph-snapshot "$GRAPH_SNAPSHOT" \
            --inbox inbox \
            --output-jsonl out/run-summary.jsonl
          echo "Run summary:"
          jq -s 'group_by(.action // .resolver_status // "other") | map({key: (.[0].action // .[0].resolver_status // "other"), count: length})' out/run-summary.jsonl

      - name: Advance discovery cursor
        # Only advance on the schedule path. workflow_dispatch with an
        # explicit lookback_hours override is one-off (often replaying
        # a window) and must not clobber the schedule's cursor.
        if: steps.snapshot.outputs.ready == 'true' && github.event_name == 'schedule'
        env:
          UNTIL: ${{ steps.discover.outputs.until }}
        run: |
          set -euo pipefail
          mkdir -p state
          jq -n --arg ts "$UNTIL" \
            '{schema_version: "1.0.0", last_run_utc: $ts}' \
            > state/scout-cursor.json
          echo "Cursor advanced to $UNTIL"

      - name: Save discovery cursor
        if: steps.snapshot.outputs.ready == 'true' && github.event_name == 'schedule'
        uses: actions/cache/save@v4
        with:
          path: state/scout-cursor.json
          # Cache keys are immutable per branch; use the run id so each
          # successful run pushes a new entry. Restore key (above) is
          # the stable prefix and gets the freshest match.
          key: scout-cursor-v1-${{ github.run_id }}

      - name: Render step summary
        if: always()
        env:
          DISCOVERED: ${{ steps.discover.outputs.total }}
          PROCESSED: ${{ steps.discover.outputs.capped }}
          WINDOW_SINCE: ${{ steps.discover.outputs.since }}
          WINDOW_UNTIL: ${{ steps.discover.outputs.until }}
          WINDOW_SOURCE: ${{ steps.discover.outputs.window_source }}
          SNAPSHOT_READY: ${{ steps.snapshot.outputs.ready }}
          SNAPSHOT_SKIP_REASON: ${{ steps.snapshot.outputs.reason }}
        run: |
          set -euo pipefail
          if [[ "$SNAPSHOT_READY" != "true" ]]; then
            {
              echo "## Scout cron skipped"
              echo ""
              echo "Reason: \`${SNAPSHOT_SKIP_REASON:-unknown}\`."
              echo ""
              echo "Trigger \`scout-snapshot.yml\` (Actions tab → run workflow) to populate the artifact, or commit a snapshot and pass its path via the \`graph_snapshot\` input."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ ! -f out/run-summary.jsonl ]]; then
            echo "## Scout cron run" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "_no run summary produced (job may have failed before the loop)._" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Merge poll + process records by cve_id (later writes win,
          # which is what we want: process outcome supersedes the
          # written-poll outcome).
          jq -s 'group_by(.cve_id) | map(reduce .[] as $r ({}; . * $r))' \
            out/run-summary.jsonl > out/merged.json

          {
            echo "## Scout cron run"
            echo ""
            echo "- Window: \`${WINDOW_SINCE}\` -> \`${WINDOW_UNTIL}\` (source: \`${WINDOW_SOURCE:-unknown}\`)"
            echo "- Discovered: **${DISCOVERED:-0}**"
            echo "- Processed: **${PROCESSED:-0}**"
            echo ""
            echo "### Per-CVE outcomes"
            echo ""
            echo "| CVE | action | finding | resolver verdict | feed |"
            echo "|-----|--------|---------|------------------|------|"
            jq -r '
              sort_by(.cve_id)[] |
              "| `" + .cve_id + "` | " +
              (.action // "-") + " | " +
              (.finding_status // "-") + " | " +
              (.resolver_status // "-") + " | " +
              (.feed_used // "-") + " |"
            ' out/merged.json
            echo ""

            echo "### Action breakdown"
            echo ""
            echo '```mermaid'
            echo "pie showData title Poll actions"
            jq -r '
              group_by(.action) |
              map(select(.[0].action != null)) |
              .[] |
              "    \"" + (.[0].action) + "\" : " + (length | tostring)
            ' out/merged.json
            echo '```'
            echo ""

            echo "### Resolver verdicts"
            echo ""
            echo '```mermaid'
            echo "pie showData title Resolver verdicts"
            jq -r '
              group_by(.resolver_status) |
              map(select(.[0].resolver_status != null)) |
              .[] |
              "    \"" + (.[0].resolver_status) + "\" : " + (length | tostring)
            ' out/merged.json
            # Mermaid refuses to render an empty pie; stub a no-op slice.
            if ! jq -e 'any(.resolver_status != null)' out/merged.json > /dev/null; then
              echo "    \"no findings\" : 1"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Append longitudinal run record
        # Schedule-only: each scheduled cron contributes one aggregated
        # row to data/scout-runs.jsonl on main. Manual workflow_dispatch
        # runs are operational replays and do not pollute the time series.
        if: steps.snapshot.outputs.ready == 'true' && github.event_name == 'schedule'
        env:
          WINDOW_SINCE: ${{ steps.discover.outputs.since }}
          WINDOW_UNTIL: ${{ steps.discover.outputs.until }}
          WINDOW_SOURCE: ${{ steps.discover.outputs.window_source }}
          DISCOVERED: ${{ steps.discover.outputs.total }}
          PROCESSED: ${{ steps.discover.outputs.capped }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p data
          if [[ -f out/merged.json ]]; then
            actions=$(jq '[group_by(.action)[] | select(.[0].action != null) | {(.[0].action): length}] | add // {}' out/merged.json)
            verdicts=$(jq '[group_by(.resolver_status)[] | select(.[0].resolver_status != null) | {(.[0].resolver_status): length}] | add // {}' out/merged.json)
          else
            actions='{}'
            verdicts='{}'
          fi
          record=$(jq -cn \
            --arg run_at "$WINDOW_UNTIL" \
            --arg since "$WINDOW_SINCE" \
            --arg source "$WINDOW_SOURCE" \
            --arg run_id "$RUN_ID" \
            --argjson discovered "${DISCOVERED:-0}" \
            --argjson processed "${PROCESSED:-0}" \
            --argjson actions "$actions" \
            --argjson verdicts "$verdicts" \
            '{
               schema_version: "1.0.0",
               run_at: $run_at,
               window_since: $since,
               window_source: $source,
               run_id: $run_id,
               discovered: $discovered,
               processed: $processed,
               actions: $actions,
               resolver_verdicts: $verdicts
             }')
          echo "$record" >> data/scout-runs.jsonl
          # Race-tolerant push: if main moved while we ran, rebase our
          # one-line append on top. The data file is append-only so the
          # rebase is conflict-free in practice.
          git config user.name "scout-cron[bot]"
          git config user.email "scout-cron[bot]@users.noreply.github.com"
          git add data/scout-runs.jsonl
          git commit -m "data(scout): cron run ${WINDOW_UNTIL} [skip ci]"
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              echo "pushed run record on attempt $attempt"
              exit 0
            fi
            echo "push attempt $attempt failed; retrying"
            sleep $((attempt * 5))
          done
          echo "::warning::failed to push longitudinal run record after 3 attempts; data point lost"
          exit 0  # do not fail the cron over an aux push

      - name: Upload inbox + run summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scout-cron-${{ github.run_id }}
          path: |
            inbox/
            out/
          if-no-files-found: warn
          retention-days: 14
