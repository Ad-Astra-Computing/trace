name: scout-snapshot

# Build a nixpkgs graph snapshot via `nix-env -qaP --json` and upload
# it as an artifact. Other workflows (scout-cron, scout-poll) download
# this artifact instead of relying on a hand-written smoke fixture.
#
# Triggers:
#   * workflow_dispatch: on demand.
#   * schedule: daily at 06:13 UTC. nixpkgs-unstable churns
#     constantly; a 24-hour-fresh snapshot is enough for CVE-relevance
#     filtering and is cheap to build.
#
# Cost shape: nix-env -qaP --json against nixpkgs takes 5-15 minutes
# of CPU on the GitHub runner; the resulting JSON is ~30-50 MB.
# Artifact retention defaults to 14 days (gh-actions default for
# artifact downloads).
#
# This workflow does NOT push the snapshot to the repo. Snapshots are
# build artifacts, not source. The cron workflow downloads the latest
# artifact at run time.

on:
  workflow_dispatch:
  schedule:
    - cron: "13 6 * * *"

permissions:
  contents: read
  id-token: write  # FlakeHub OIDC for the Determinate Nix installer

jobs:
  build:
    name: nixpkgs graph snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22 (pinned 2026-05-23)
        with:
          determinate: true

      - name: Build snapshot
        run: |
          set -euo pipefail
          mkdir -p out
          # --no-drv-paths: GitHub free-tier ubuntu-latest OOMs (exit 143)
          # during full nixpkgs eval when nix-env materialises drvPath for
          # ~99k attrs. drv_path falls back to "attr:<attr>" placeholder
          # which is documented as acceptable; downstream agents that need
          # real drv paths resolve them at use time on a checked-out tree.
          nix develop --command python -m agents.scout.snapshot_cli \
            --out out/nixpkgs-snapshot.json \
            --no-drv-paths
          attrs=$(jq 'length' out/nixpkgs-snapshot.json)
          size=$(wc -c < out/nixpkgs-snapshot.json | tr -d ' ')
          echo "Built snapshot with $attrs attrs ($size bytes)."
          echo "attrs=$attrs" >> "$GITHUB_OUTPUT"

      - name: Sanity check
        run: |
          set -euo pipefail
          # Snapshot must contain attrs we know nixpkgs ships unconditionally.
          for required in libtiff openssl curl; do
            if ! jq -e --arg p "$required" 'any(.[]; .pname == $p)' out/nixpkgs-snapshot.json > /dev/null; then
              echo "::error::snapshot missing required pname '$required'; aborting"
              exit 1
            fi
          done
          echo "Sanity check passed."

      - name: Upload snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nixpkgs-snapshot
          path: out/nixpkgs-snapshot.json
          if-no-files-found: error
          retention-days: 30
