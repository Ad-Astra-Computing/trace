name: steward

# Steward gate + cosign keyless OIDC signing. Manual dispatch only.
# v0 sequencing per the 2026-04-28 hand-off: this workflow comes AFTER
# builder.yml has confirmed LocalNixBuildRunner end-to-end on a
# GitHub-hosted Linux runner. Adds the signing layer on top of a
# bundle that already has real Builder outputs.
#
# Scope (locked narrow):
#   * manual dispatch only (workflow_dispatch)
#   * runs Builder inline first (same staged fixture as builder.yml)
#     so the smoke is self-contained (no inter-workflow artifact
#     dance for v0)
#   * runs the v1 Steward gate via opa against the resulting bundle
#   * if allow: computes canonical input → signs with cosign keyless
#     OIDC → populates signed_manifest identity fields → verifies the
#     signature against policy/signing-identity.json
#   * if deny: skips signing, reports the deny set, uploads artifacts
#     for inspection
#   * does NOT auto-commit, does NOT publish to a remote repository
#     yet — only writes the signed bundle into the workflow's runner
#     temp dir + uploads as artifacts
#
# References:
#   * docs/SIGNING_V1.md — locked signing contract
#   * policy/signing-identity.json — identity policy (verifiers pin)
#   * policy/steward.rego — 11-rule v1 gate

on:
  workflow_dispatch:
    inputs:
      bundle:
        description: "Bundle to gate + sign (ignored when bundle_dir is set)."
        required: true
        default: "hello"
        type: choice
        options:
          - hello
          - bind
          - uriparser
          - libtiff
          - mruby
      bundle_dir:
        description: "Optional: a bundle directory name under traces/example/ (e.g. CVE-2025-8176--libtiff). Overrides the `bundle` choice. Real-CVE bundle assumed."
        required: false
        default: ""
        type: string
      reuse_committed_build:
        description: "Skip the fork clone + Builder re-run and gate against the bundle's committed build.json. Use for bundles already cert-green (e.g. ASAN bundles whose Builder run is hours long)."
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  # Required for cosign keyless OIDC. The workflow's GITHUB_TOKEN OIDC
  # claim is what identifies "the trace Steward CI workflow on main"
  # to sigstore + Rekor. Without id-token: write, cosign sign-blob
  # cannot fetch the signing certificate.
  id-token: write

env:
  # Pinned to match .github/workflows/ci.yml. Bump together.
  # See docs/SECURITY_CI_SUPPLY_CHAIN.md for the install trust statement.
  OPA_VERSION: "v1.0.1"
  COHORT_LABEL: "real-ci-smoke"

jobs:
  gate-and-sign:
    name: steward gate + cosign keyless sign (${{ inputs.bundle }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ github.workspace }}

    steps:
      - uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14

      # See docs/SECURITY_CI_SUPPLY_CHAIN.md. Pinned by full commit SHA.
      - name: Install OPA
        uses: open-policy-agent/setup-opa@b2b258e089860efaadaaf71bf6e3aecb4a3eeff1 # v2.4.0
        with:
          version: ${{ env.OPA_VERSION }}
          static: true

      - name: Install cosign (sigstore)
        # cosign-installer is the official sigstore action; it sets up
        # cosign on $PATH. Pinned to a major-version tag here; bump the
        # tag string when sigstore publishes a new major release. A
        # Dependabot config update in this repo can pin to a full SHA
        # like the DeterminateSystems actions do.
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.4.1'

      - name: Preflight — toolchain present
        run: |
          set -euo pipefail
          command -v nix-build
          command -v opa
          command -v cosign
          # Capture-then-head: avoids SIGPIPE 141 under pipefail when
          # `head` closes its stdin before the producer finishes writing.
          # Hit this on run 25075360259 — bind got lucky on 25074542863.
          OPA_VERSION_OUT="$(opa version)"
          printf '%s\n' "$OPA_VERSION_OUT" | head -1
          COSIGN_VERSION_OUT="$(cosign version 2>&1)"
          printf '%s\n' "$COSIGN_VERSION_OUT" | head -3

      - name: Stage bundle
        id: paths
        env:
          # Pass user-controlled dispatch inputs via env, never interpolate
          # directly into the shell (CLAUDE.md workflow-injection guidance).
          BUNDLE_CHOICE: ${{ inputs.bundle }}
          BUNDLE_DIR_INPUT: ${{ inputs.bundle_dir }}
        run: |
          set -euo pipefail
          # bundle_dir override: gate+sign any bundle under traces/example/
          # without needing a hardcoded case entry. Sanitize to the canonical
          # CVE-bundle directory shape so the path can't escape traces/example/.
          if [ -n "${BUNDLE_DIR_INPUT}" ]; then
            if ! printf '%s' "${BUNDLE_DIR_INPUT}" | grep -qE '^CVE-[0-9]{4}-[0-9]+--[A-Za-z0-9_.-]+$'; then
              echo "::error::bundle_dir ${BUNDLE_DIR_INPUT} must match CVE-YYYY-NNNN--<attr> (no path separators)"; exit 64
            fi
            BUNDLE="${BUNDLE_DIR_INPUT}"
            OUT="${RUNNER_TEMP}/steward-smoke/${BUNDLE}"
            mkdir -p "$OUT"
            SRC="traces/example/${BUNDLE_DIR_INPUT}"
            if [ ! -f "${SRC}/bundle.json" ]; then
              echo "::error::no bundle.json under ${SRC}"; exit 64
            fi
            REAL_CVE="true"
            cp -R "${SRC}/." "$OUT/"
            echo "out=$OUT" >> "$GITHUB_OUTPUT"
            echo "label=$BUNDLE" >> "$GITHUB_OUTPUT"
            echo "real_cve=$REAL_CVE" >> "$GITHUB_OUTPUT"
            echo "src=$SRC" >> "$GITHUB_OUTPUT"
            REV=$(python3 -c "import json; print(json.load(open('$OUT/bundle.json'))['nixpkgs_rev'])")
            echo "nixpkgs_rev=$REV" >> "$GITHUB_OUTPUT"
            echo "bundle_dir override: staged ${SRC} (nixpkgs_rev=$REV)"
            exit 0
          fi
          BUNDLE="${BUNDLE_CHOICE}"
          OUT="${RUNNER_TEMP}/steward-smoke/${BUNDLE}"
          mkdir -p "$OUT"
          # Synthetic bundles (hello) live under tests/fixtures/real-ci/
          # and run with nixpkgs_checkout=None against a bundle-local
          # default.nix shim. Real-CVE bundles live under traces/example/
          # and require a fork checkout at the recorded nixpkgs_rev for
          # patch-apply + patched-build.
          case "$BUNDLE" in
            hello)
              SRC="tests/fixtures/real-ci/builder/${BUNDLE}"
              REAL_CVE="false"
              ;;
            bind)
              SRC="traces/example/CVE-2025-13878--bind"
              REAL_CVE="true"
              ;;
            uriparser)
              # Human-review-required bundle (major-version-jump). Builder
              # short-circuits on the existing reproducer-refusal artifact,
              # so a fork checkout isn't needed; Steward only enforces
              # rules 4+5 on this kind, both of which are already green.
              SRC="traces/example/CVE-2025-67899--uriparser"
              REAL_CVE="false"
              ;;
            libtiff)
              # Auto-merge bundle: deterministic-no-model attribution,
              # real upstream backport (CVE-2024-13978), real PoC. Builder
              # needs the fork checkout to apply patch.diff and run the
              # reproducer.nix sandbox-positive test against unpatched +
              # patched libtiff derivations.
              SRC="traces/example/CVE-2024-13978--libtiff"
              REAL_CVE="true"
              ;;
            mruby)
              # Human-review-required bundle (deterministic-no-model corpus
              # seed for CVE-2025-7207). Reproducer is a refusal under rule
              # 3 (heap-buffer-overflow silent without ASAN); Steward only
              # enforces rules 4+5 on this kind. Builder short-circuits on
              # the existing reproducer-refusal artifact, no fork checkout
              # needed.
              SRC="traces/example/CVE-2025-7207--mruby"
              REAL_CVE="false"
              ;;
            *)
              echo "::error::unknown bundle ${BUNDLE}"; exit 64 ;;
          esac
          cp -R "${SRC}/." "$OUT/"
          echo "out=$OUT" >> "$GITHUB_OUTPUT"
          echo "label=$BUNDLE" >> "$GITHUB_OUTPUT"
          echo "real_cve=$REAL_CVE" >> "$GITHUB_OUTPUT"
          echo "src=$SRC" >> "$GITHUB_OUTPUT"
          if [ "$REAL_CVE" = "true" ]; then
            REV=$(python3 -c "import json; print(json.load(open('$OUT/bundle.json'))['nixpkgs_rev'])")
            echo "nixpkgs_rev=$REV" >> "$GITHUB_OUTPUT"
            echo "Real-CVE bundle. nixpkgs_rev=$REV"
          fi

      - name: Clone fork at bundle's nixpkgs_rev (real-CVE only)
        if: ${{ steps.paths.outputs.real_cve == 'true' && !inputs.reuse_committed_build }}
        id: nixpkgs
        run: |
          set -euo pipefail
          REV="${{ steps.paths.outputs.nixpkgs_rev }}"
          NIXPKGS="${RUNNER_TEMP}/nixpkgs-fork"
          git clone --filter=blob:none --no-checkout \
            https://github.com/Ad-Astra-Computing/nixpkgs.git "$NIXPKGS"
          cd "$NIXPKGS"
          git fetch --depth 1 origin "$REV"
          git checkout "$REV"
          echo "checkout=$NIXPKGS" >> "$GITHUB_OUTPUT"

      - name: Reuse committed build.json (skip Builder re-run)
        if: ${{ inputs.reuse_committed_build }}
        run: |
          set -euo pipefail
          OUT="${{ steps.paths.outputs.out }}"
          if [ ! -f "$OUT/build.json" ]; then
            echo "::error::reuse_committed_build=true but no build.json in the staged bundle"; exit 64
          fi
          echo "Reusing committed build.json (Builder re-run skipped):"
          python3 -c "import json; b=json.load(open('$OUT/build.json')); print('  patched_build:', b.get('patched_build',{}).get('outcome'), '| host:', b.get('host',{}).get('system'))"

      - name: Run Builder against the staged bundle (live nix-build)
        if: ${{ !inputs.reuse_committed_build }}
        run: |
          set -euo pipefail
          OUT="${{ steps.paths.outputs.out }}"
          REAL_CVE="${{ steps.paths.outputs.real_cve }}"
          NIXPKGS_CHECKOUT="${{ steps.nixpkgs.outputs.checkout }}"
          export NIXPKGS_CHECKOUT
          nix develop --command python3 -u <<PY
          import os
          from pathlib import Path
          from agents.builder import LocalNixBuildRunner
          from tools.trace_cli.execute import execute

          out = Path("$OUT")
          checkout_path = os.environ.get("NIXPKGS_CHECKOUT") or None
          checkout = Path(checkout_path) if checkout_path else None
          fresh_invocation = {"invocation_id": None, "inputs": [], "outputs": []}
          result = execute(
              role="builder",
              bundle_dir=out,
              invocation=fresh_invocation,
              verify=False,
              build_runner_factory=lambda: LocalNixBuildRunner(),
              nixpkgs_checkout=checkout,
          )
          # Builder dispatch_outcome is data, not infra failure.
          # Synthetic 'hello' should always be 'ok'; real-CVE bundles
          # may legitimately come out 'refused-no-reproducer' (e.g. bind
          # has reproducer-refusal.json from the 2026-04-29 sonnet 4.5
          # probe). Don't assert on the outcome here — let Steward + the
          # signing-skip-on-deny path handle it downstream.
          print(f"Builder dispatch_outcome={result['dispatch_outcome']}, "
                f"invocation_id={result['invocation_id']}")
          PY

      - name: Run Steward gate via opa
        id: gate
        run: |
          set -euo pipefail
          OUT="${{ steps.paths.outputs.out }}"
          nix develop --command python3 -u <<PY
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          # Build the opa input doc per docs/STEWARD_V1.md sec.1.
          # Optional fields (build, repro_scoring, review_scoring,
          # reproducer_refusal) are omitted when absent so Rego's
          # `not input.foo` semantics work.
          out = Path("$OUT")
          def _load(name):
              p = out / name
              return json.loads(p.read_text()) if p.exists() else None

          provenance = []
          prov_path = out / "provenance.jsonl"
          if prov_path.exists():
              for line in prov_path.read_text().splitlines():
                  if line.strip():
                      provenance.append(json.loads(line))

          inputs = {
              "bundle": _load("bundle.json"),
              "finding": _load("finding.json"),
              "upstream_ref": _load("upstream-ref.json"),
              "replay": _load("replay.json"),
              "provenance": provenance,
          }
          for opt_field, opt_filename in (
              ("build", "build.json"),
              ("repro_scoring", "repro-scoring-report.json"),
              ("review_scoring", "review-scoring-report.json"),
              ("reproducer_refusal", "reproducer-refusal.json"),
          ):
              loaded = _load(opt_filename)
              if loaded is not None:
                  inputs[opt_field] = loaded

          proc = subprocess.run(
              ["opa", "eval", "--format=json",
               "--data", "policy/steward.rego", "--stdin-input",
               "data.trace.steward"],
              input=json.dumps(inputs),
              capture_output=True, text=True, check=True,
          )
          decision = json.loads(proc.stdout)["result"][0]["expressions"][0]["value"]
          allow = decision.get("allow", False)
          deny = decision.get("deny", [])

          print(f"Steward decision: allow={allow}")
          if deny:
              print("Deny set:")
              for d in deny:
                  print(f"  {d.get('rule_id')}: {d.get('message')}")
          else:
              print("Deny set: empty")

          # Emit GITHUB_OUTPUT so the next steps can branch on allow.
          gh_out = os.environ.get("GITHUB_OUTPUT")
          if gh_out:
              with open(gh_out, "a") as f:
                  f.write(f"allow={'true' if allow else 'false'}\n")
                  f.write(f"deny_count={len(deny)}\n")

          # Persist the decision into the bundle dir for artifact upload.
          (out / "steward-decision.json").write_text(
              json.dumps(decision, indent=2) + "\n"
          )
          PY

      - name: Sign bundle (cosign keyless OIDC) — only if Steward allowed
        if: ${{ steps.gate.outputs.allow == 'true' }}
        env:
          # Sign-blob with GitHub Actions OIDC. cosign reads the OIDC
          # token from the runner-injected env. No private key.
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          OUT="${{ steps.paths.outputs.out }}"

          # Canonical input for the signature: a frozen pre-sign snapshot
          # of bundle.json. We sign this immutable copy so the signature
          # remains valid forever, regardless of any post-sign metadata
          # mutations on bundle.json itself (e.g. populating
          # signed_manifest.identity_subject + rekor_log_index).
          # Downstream verifiers verify against bundle.canonical.json.
          CANONICAL="$OUT/bundle.canonical.json"
          cp "$OUT/bundle.json" "$CANONICAL"
          test -f "$CANONICAL"

          # cosign sign-blob with --yes (non-interactive) + --bundle to
          # write the bundle artifact (DSSE envelope + signing cert +
          # Rekor proof). The --output-certificate flag captures the
          # signing certificate for downstream identity verification.
          cosign sign-blob \
            --yes \
            --bundle "$OUT/bundle.sig" \
            --output-certificate "$OUT/cosign-cert.pem" \
            "$CANONICAL"

          echo "signed bundle.canonical.json → $OUT/bundle.sig"
          ls -la "$OUT/bundle.canonical.json" "$OUT/bundle.sig" "$OUT/cosign-cert.pem"

      - name: Populate signed_manifest identity fields
        if: ${{ steps.gate.outputs.allow == 'true' }}
        run: |
          set -euo pipefail
          OUT="${{ steps.paths.outputs.out }}"
          nix develop --command python3 -u <<PY
          import json
          import re
          import subprocess
          from pathlib import Path

          import base64
          out = Path("$OUT")
          bundle = json.loads((out / "bundle.json").read_text())

          # Extract the OIDC subject + issuer from the signing certificate.
          # cosign 2.4.x's --output-certificate writes a base64-encoded PEM.
          # Earlier cosign versions wrote raw PEM. Detect which form we got
          # and decode if needed.
          cert_raw = (out / "cosign-cert.pem").read_text().strip()
          if cert_raw.startswith("-----BEGIN"):
              cert_pem = cert_raw
          else:
              cert_pem = base64.b64decode(cert_raw).decode("ascii")
          proc = subprocess.run(
              ["openssl", "x509", "-noout", "-text"],
              input=cert_pem, capture_output=True, text=True, check=True,
          )
          cert_text = proc.stdout

          # Subject: the URI SAN entry (e.g.
          #   URI:https://github.com/Ad-Astra-Computing/trace/.github/...)
          subj_match = re.search(r"URI:(\S+)", cert_text)
          identity_subject = subj_match.group(1) if subj_match else None

          # Issuer: the OIDC issuer extension (1.3.6.1.4.1.57264.1.1).
          # cosign-cert.pem includes a Fulcio extension with the OIDC
          # issuer URL; extract it via grep on the raw text.
          issuer_match = re.search(
              r"1\.3\.6\.1\.4\.1\.57264\.1\.1[^:]*:[^\n]*?(https://\S+)",
              cert_text,
          )
          identity_issuer = issuer_match.group(1) if issuer_match else (
              "https://token.actions.githubusercontent.com"
          )

          bundle.setdefault("signed_manifest", {})
          bundle["signed_manifest"]["identity_subject"] = identity_subject
          bundle["signed_manifest"]["identity_issuer"] = identity_issuer
          bundle["signed_manifest"]["signer"] = identity_subject or "unknown"

          # Rekor coordinates from the cosign --bundle output. cosign's
          # bundle is a JSON file when --bundle is used; the rekorBundle
          # carries logIndex + logID. logID is the Rekor public-instance
          # shard identifier (constant across every entry on that shard),
          # NOT a per-entry UUID. The per-entry UUID is exposed by the
          # Rekor public API at /api/v1/log/entries?logIndex=<N> as the
          # single map key in the returned object. We query it here so
          # downstream auditors can dereference the entry directly.
          import urllib.request
          import urllib.parse
          sig_bundle = json.loads((out / "bundle.sig").read_text())
          rekor_log = sig_bundle.get("rekorBundle", {}).get("Payload", {})
          if "logIndex" in rekor_log:
              log_index = int(rekor_log["logIndex"])
              bundle["signed_manifest"]["rekor_log_index"] = log_index
              # Lookup the per-entry UUID via Rekor public API.
              api = "https://rekor.sigstore.dev/api/v1/log/entries"
              url = api + "?" + urllib.parse.urlencode({"logIndex": log_index})
              try:
                  with urllib.request.urlopen(url, timeout=15) as r:
                      payload = json.loads(r.read().decode("utf-8"))
                  uuids = list(payload.keys())
                  if len(uuids) == 1 and re.fullmatch(r"[0-9a-f]{64,}", uuids[0]):
                      bundle["signed_manifest"]["rekor_uuid"] = uuids[0]
                  else:
                      print(
                          f"::warning::Rekor lookup for logIndex={log_index} "
                          f"returned unexpected shape (keys={uuids!r}); leaving "
                          f"rekor_uuid unset"
                      )
              except Exception as exc:  # noqa: BLE001
                  print(
                      f"::warning::Rekor UUID lookup failed for logIndex="
                      f"{log_index}: {exc!r}. Entry remains uniquely "
                      f"identifiable by log_index."
                  )

          (out / "bundle.json").write_text(json.dumps(bundle, indent=2) + "\n")
          print(f"signed_manifest populated:")
          print(json.dumps(bundle["signed_manifest"], indent=2))
          PY

      - name: Verify signature against locked identity policy
        id: verify_sig
        if: ${{ steps.gate.outputs.allow == 'true' }}
        run: |
          set -euo pipefail
          OUT="${{ steps.paths.outputs.out }}"
          # Read the locked identity policy via plain python3 (the
          # ubuntu-latest runner ships python3; using `nix develop --command`
          # would mix the dev-shell startup banner into stdout and
          # contaminate the captured variable). Verifiers pin against
          # subject_regex + oidc_issuer from policy/signing-identity.json.
          SUBJECT_REGEX=$(python3 -c "
          import json
          si = json.load(open('policy/signing-identity.json'))
          print(si['paths']['sigstore-keyless-oidc-github-actions']['subject_regex'])
          ")
          OIDC_ISSUER=$(python3 -c "
          import json
          si = json.load(open('policy/signing-identity.json'))
          print(si['paths']['sigstore-keyless-oidc-github-actions']['oidc_issuer'])
          ")
          echo "verifying against:"
          echo "  certificate-identity-regexp: ${SUBJECT_REGEX}"
          echo "  certificate-oidc-issuer:     ${OIDC_ISSUER}"

          # Verify against the FROZEN canonical snapshot, not bundle.json.
          # The post-sign metadata population mutates bundle.json (adding
          # signed_manifest.identity_subject + rekor coordinates), so the
          # signature, made over the pre-mutation bundle.json content,
          # must verify against the snapshot we kept at sign time.
          cosign verify-blob \
            --certificate-identity-regexp "${SUBJECT_REGEX}" \
            --certificate-oidc-issuer "${OIDC_ISSUER}" \
            --bundle "$OUT/bundle.sig" \
            "$OUT/bundle.canonical.json"
          echo "signature verifies under the locked identity policy"

      - name: Skip signing (Steward denied)
        if: ${{ steps.gate.outputs.allow != 'true' }}
        run: |
          set -euo pipefail
          OUT="${{ steps.paths.outputs.out }}"
          echo "::warning::Steward denied; skipping signing."
          echo "Deny count: ${{ steps.gate.outputs.deny_count }}"
          echo "See steward-decision.json in the uploaded artifacts."
          # Exit 0 so the artifacts upload step still runs; a deny is
          # data, not infra failure.

      - name: Write run summary
        if: ${{ always() }}
        # Plain python3 (stdlib-only renderer) — NOT `nix develop --command`,
        # whose startup banner would contaminate the step summary. Run as a
        # standalone file so the package __init__ isn't imported. The renderer
        # reads only verdict + public Rekor/identity fields; it never touches
        # bundle.sig or cosign-cert.pem.
        run: |
          python3 "${GITHUB_WORKSPACE}/tools/trace_cli/ci_summary.py" \
            --mode steward \
            --bundle-dir "${{ steps.paths.outputs.out }}" \
            --bundle-name "${{ steps.paths.outputs.label }}" \
            --decision "${{ steps.paths.outputs.out }}/steward-decision.json" \
            --artifact-name "steward-smoke-${{ steps.paths.outputs.label }}" \
            --verified "${{ steps.verify_sig.outcome }}" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Upload bundle + decision artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ always() }}
        with:
          name: steward-smoke-${{ steps.paths.outputs.label }}
          path: |
            ${{ steps.paths.outputs.out }}/bundle.json
            ${{ steps.paths.outputs.out }}/bundle.canonical.json
            ${{ steps.paths.outputs.out }}/build.json
            ${{ steps.paths.outputs.out }}/replay.json
            ${{ steps.paths.outputs.out }}/steward-decision.json
            ${{ steps.paths.outputs.out }}/bundle.sig
            ${{ steps.paths.outputs.out }}/cosign-cert.pem
          if-no-files-found: warn
