name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege baseline. ci.yml runs deterministic test jobs only;
# none of them write to the repo or external services, so contents:read
# is sufficient. The signing workflow (steward.yml) is the single place
# id-token:write is granted.
permissions:
  contents: read

# Single source of truth for OPA version. Pinned, not `latest`. Install
# is delegated to the official open-policy-agent/setup-opa action, itself
# pinned by full commit SHA (see job steps below). The action handles
# version resolution + checksum verification against the GitHub release
# manifest, one trust hop further than a bare curl. Bump OPA_VERSION
# and the setup-opa SHA together; see docs/SECURITY_CI_SUPPLY_CHAIN.md.
env:
  TRACE_REQUIRE_OPA: "1"
  OPA_VERSION: "v1.0.1"

  # Three intentional pytest skips are expected under CI:
  #   1. TRACE_STRICT_HASHES=1 gated test — fixture hashes are placeholders
  #      until the bundle-production pipeline writes real ones. Will flip to
  #      required at that milestone.
  #   2. CVE-0000-9001--advisory-has-patch — schema-invalid, never reaches
  #      Steward. Expected-to-skip forever.
  #   3. CVE-0000-9002--auto-merge-missing-reproducer — same reason.

jobs:
  test:
    name: schema + steward
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v6

      # DeterminateSystems actions pinned by full commit SHA (gold standard
      # for security/evidence projects). The `# v22` / `# v13` comments
      # document the human-readable tag so Dependabot has a target to update
      # against. Resolve a new SHA with:
      #   git ls-remote https://github.com/DeterminateSystems/<action>.git refs/tags/vN
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14

      # setup-opa is the official open-policy-agent install action.
      # Pinned by full commit SHA (gold standard for security/evidence
      # projects). The `# v2.4.0` comment documents the human-readable
      # tag so Dependabot has a target to update against. Resolve a new
      # SHA with:
      #   git ls-remote https://github.com/open-policy-agent/setup-opa.git refs/tags/vN.N.N
      # See docs/SECURITY_CI_SUPPLY_CHAIN.md for the full trust statement.
      - name: Install OPA
        uses: open-policy-agent/setup-opa@b2b258e089860efaadaaf71bf6e3aecb4a3eeff1 # v2.4.0
        with:
          version: ${{ env.OPA_VERSION }}
          static: true

      - name: Preflight — OPA must be present and correct version
        run: |
          set -euo pipefail
          command -v opa
          opa version | tee /tmp/opa-version.txt
          grep -F "Version: ${OPA_VERSION#v}" /tmp/opa-version.txt

      - name: Run tests
        run: nix develop --command pytest -v

  lint-rego:
    name: rego fmt + check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v6

      # setup-opa is the official open-policy-agent install action.
      # Pinned by full commit SHA (gold standard for security/evidence
      # projects). The `# v2.4.0` comment documents the human-readable
      # tag so Dependabot has a target to update against. Resolve a new
      # SHA with:
      #   git ls-remote https://github.com/open-policy-agent/setup-opa.git refs/tags/vN.N.N
      # See docs/SECURITY_CI_SUPPLY_CHAIN.md for the full trust statement.
      - name: Install OPA
        uses: open-policy-agent/setup-opa@b2b258e089860efaadaaf71bf6e3aecb4a3eeff1 # v2.4.0
        with:
          version: ${{ env.OPA_VERSION }}
          static: true

      - name: Preflight — OPA must be present and correct version
        run: |
          set -euo pipefail
          command -v opa
          opa version | tee /tmp/opa-version.txt
          grep -F "Version: ${OPA_VERSION#v}" /tmp/opa-version.txt

      - name: opa fmt --diff
        run: opa fmt --diff policy/steward.rego

      - name: opa check
        run: opa check policy/steward.rego

  graph:
    # Separate job: Rust toolchain + compile time stay out of the schema/Steward
    # feedback loop. Rust is NOT in the default devShell (`.#graph` is opt-in
    # locally); this job installs rustc/cargo via actions-rust-lang toolchain
    # action and runs only the graph-related tests.
    name: graph (rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    env:
      # Pinned Rust toolchain. Crate has no MSRV sensitivity; pinning anyway so
      # CI output is deterministic. Bump this string to upgrade.
      RUST_TOOLCHAIN: "1.85.0"
      # Known 40-hex rev used by the --rev end-to-end test. Any valid hex works;
      # this is a fixture, not a real commit hash.
      KNOWN_REV: "abcdef0123456789abcdef0123456789abcdef01"
      # Fail the job if cargo is missing instead of silently skipping the smoke
      # layer in tests/graph/test_graph_snapshot.py.
      TRACE_REQUIRE_CARGO: "1"
      # Same for nix: the live-extraction tests in tests/graph/test_graph_extract.py
      # must actually run in CI, not silently skip.
      TRACE_REQUIRE_NIX: "1"
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain (pinned)
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: ""

      - name: Preflight — rustc + cargo present, pinned version
        run: |
          set -euo pipefail
          command -v rustc
          command -v cargo
          rustc --version
          cargo --version
          rustc --version | grep -F "${RUST_TOOLCHAIN}"

      - name: Cache cargo build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            graph/target
          key: cargo-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('graph/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-

      - name: cargo test
        run: cargo test --manifest-path graph/Cargo.toml

      - name: cargo run — emit snapshot with known rev
        run: |
          set -euo pipefail
          cargo run --quiet --manifest-path graph/Cargo.toml -- --rev "${KNOWN_REV}" > /tmp/snapshot.json
          test -s /tmp/snapshot.json
          grep -F "\"nixpkgs_rev\": \"${KNOWN_REV}\"" /tmp/snapshot.json
          grep -F "\"schema_version\": \"1.0.0\"" /tmp/snapshot.json

      # DeterminateSystems actions pinned by full commit SHA (gold standard
      # for security/evidence projects). The `# v22` / `# v13` comments
      # document the human-readable tag so Dependabot has a target to update
      # against. Resolve a new SHA with:
      #   git ls-remote https://github.com/DeterminateSystems/<action>.git refs/tags/vN
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14

      # The graph job inherits TRACE_REQUIRE_OPA=1 from the workflow-level
      # env (set so the schema+steward job's Steward tests fail loudly on
      # missing opa rather than silently skipping). Two tests under
      # tests/graph/test_enrichment_replay.py also require opa for the
      # steward replay path; install it here as well.
      # setup-opa is the official open-policy-agent install action.
      # Pinned by full commit SHA (gold standard for security/evidence
      # projects). The `# v2.4.0` comment documents the human-readable
      # tag so Dependabot has a target to update against. Resolve a new
      # SHA with:
      #   git ls-remote https://github.com/open-policy-agent/setup-opa.git refs/tags/vN.N.N
      # See docs/SECURITY_CI_SUPPLY_CHAIN.md for the full trust statement.
      - name: Install OPA
        uses: open-policy-agent/setup-opa@b2b258e089860efaadaaf71bf6e3aecb4a3eeff1 # v2.4.0
        with:
          version: ${{ env.OPA_VERSION }}
          static: true

      - name: Python schema validation of the emitted snapshot + cargo smoke tests
        run: nix develop --command pytest -v tests/graph
