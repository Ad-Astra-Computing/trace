name: scout-poll

# Scout cron poller. Manual dispatch only at v0; once a graph-snapshot
# builder lands and a CVE-discovery feed is wired in, this becomes the
# hourly cron entrypoint.
#
# Inputs:
#   cve_id           A CVE id (e.g. CVE-2024-13978) to poll.
#   graph_snapshot   Path to a JSON graph snapshot in the repo (or an
#                    artifact pulled in a future iteration). Optional;
#                    defaults to a stub snapshot in fixtures/ for smoke.
#
# What it does:
#   1. Fetches the dossier (cve.vulnpatch.dev). On 404 / decode-fail,
#      falls back to NVD-direct.
#   2. Normalizes via the matching feed normalizer.
#   3. Filters against the graph snapshot for nixpkgs relevance.
#   4. Writes <inbox>/<CVE-ID>/{scout-input,raw-<source>,fetch-meta,
#      relevance}.json atomically. Idempotent.
#
# Exit codes (mirrored from agents.scout.poll_cli):
#   0  written or skipped-irrelevant
#   10 fetch-failed (both feeds 404 / transient)
#   20 rate-limited
#   64 usage error (bad CVE id / snapshot / args)
#
# NVD_API_KEY (optional secret): when present, lifts the NVD rate
# limit. Anonymous-first; never required.

on:
  workflow_dispatch:
    inputs:
      cve_id:
        description: "CVE id to poll (e.g. CVE-2024-13978)"
        required: true
        type: string
      graph_snapshot:
        description: "Path to graph snapshot JSON in the repo"
        required: false
        type: string
        default: "tests/scout/fixtures/graph-snapshot-smoke.json"

permissions:
  contents: read

jobs:
  poll:
    name: scout poll one cve
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22 (pinned 2026-05-23)
        with:
          determinate: true

      - name: Validate inputs
        run: |
          set -euo pipefail
          if [[ ! "${{ inputs.cve_id }}" =~ ^CVE-[0-9]{4}-[0-9]{4,19}$ ]]; then
            echo "::error::cve_id must match CVE-YYYY-NNNN+: got '${{ inputs.cve_id }}'"
            exit 64
          fi
          if [[ ! -f "${{ inputs.graph_snapshot }}" ]]; then
            echo "::error::graph snapshot not found at ${{ inputs.graph_snapshot }}"
            exit 64
          fi

      - name: Run Scout poller
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p inbox
          nix develop --command python -m agents.scout.poll_cli \
            "${{ inputs.cve_id }}" \
            --graph-snapshot "${{ inputs.graph_snapshot }}" \
            --inbox inbox \
            | tee scout-poll.json
          jq -e '.action != null' scout-poll.json > /dev/null

      - name: Upload inbox entry as artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: inbox-${{ inputs.cve_id }}
          path: |
            inbox/${{ inputs.cve_id }}/
            scout-poll.json
          if-no-files-found: warn
          retention-days: 7
